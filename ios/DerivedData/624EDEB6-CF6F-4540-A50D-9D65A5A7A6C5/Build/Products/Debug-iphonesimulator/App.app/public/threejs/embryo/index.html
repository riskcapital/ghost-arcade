<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// Ghost Arcade embryo — atomic fractal raymarcher
// Single fragment shader, no external dependencies.
//
// Exposes 8 live params via window.shaderParams; the host can write
// to them from sliders / MIDI / audio modulation. shaderParamDefs
// declares the UI schema so the panel knows label, range, type.
// ============================================================

window.shaderParamDefs = [
  { name: 'speed',            label: 'Speed',            type: 'number', min: 0,    max: 3,    default: 1.0 },
  { name: 'cameraDistance',   label: 'Camera Distance',  type: 'number', min: 4,    max: 16,   default: 8.0 },
  { name: 'fov',              label: 'Field of View',    type: 'number', min: 0.6,  max: 2.6,  default: 1.6 },
  { name: 'particleGlow',     label: 'Particle Glow',    type: 'number', min: 0,    max: 3,    default: 1.0 },
  { name: 'lineGlow',         label: 'Connection Glow',  type: 'number', min: 0,    max: 3,    default: 1.0 },
  { name: 'nucleusIntensity', label: 'Nucleus Intensity',type: 'number', min: 0,    max: 3,    default: 1.0 },
  { name: 'vignette',         label: 'Vignette',         type: 'number', min: 0,    max: 1,    default: 0.35 },
  { name: 'electronColor',    label: 'Electron Tint',    type: 'color',  default: [0.4, 0.7, 1.0] }
];

window.shaderParams = {
  speed: 1.0,
  cameraDistance: 8.0,
  fov: 1.6,
  particleGlow: 1.0,
  lineGlow: 1.0,
  nucleusIntensity: 1.0,
  vignette: 0.35,
  electronColor: [0.4, 0.7, 1.0]
};

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px;font-family:monospace">WebGL not available</p>'; throw new Error('no webgl'); }

const vs = `attribute vec2 p; void main() { gl_Position = vec4(p, 0, 1); }`;

const fs = `
  precision highp float;
  uniform float t;
  uniform vec2 r;
  uniform float uCamDist;
  uniform float uFov;
  uniform float uParticleGlow;
  uniform float uLineGlow;
  uniform float uNucleusIntensity;
  uniform float uVignette;
  uniform vec3 uElectronColor;

  #define PI 3.14159265359

  mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

  // ---- blend modes ----
  vec3 blendAdd(vec3 a, vec3 b) { return a + b; }
  vec3 blendExclusion(vec3 a, vec3 b) { return a + b - 2.0 * a * b; }
  vec3 blendScreen(vec3 a, vec3 b) { return 1.0 - (1.0 - a) * (1.0 - b); }
  vec3 blendOverlay(vec3 a, vec3 b) {
    vec3 r;
    r.r = a.r < 0.5 ? 2.0*a.r*b.r : 1.0 - 2.0*(1.0-a.r)*(1.0-b.r);
    r.g = a.g < 0.5 ? 2.0*a.g*b.g : 1.0 - 2.0*(1.0-a.g)*(1.0-b.g);
    r.b = a.b < 0.5 ? 2.0*a.b*b.b : 1.0 - 2.0*(1.0-a.b)*(1.0-b.b);
    return r;
  }
  vec3 blendDifference(vec3 a, vec3 b) { return abs(a - b); }

  vec3 blendMix(vec3 base, vec3 blend, float time) {
    float cycle = mod(time * 0.03, 5.0);
    vec3 b1, b2;
    float mixAmt = fract(cycle);
    if (cycle < 1.0)      { b1 = blendAdd(base, blend);        b2 = blendExclusion(base, blend); }
    else if (cycle < 2.0) { b1 = blendExclusion(base, blend);  b2 = blendScreen(base, blend); }
    else if (cycle < 3.0) { b1 = blendScreen(base, blend);     b2 = blendOverlay(base, blend); }
    else if (cycle < 4.0) { b1 = blendOverlay(base, blend);    b2 = blendDifference(base, blend); }
    else                  { b1 = blendDifference(base, blend); b2 = blendAdd(base, blend); }
    float mt = mixAmt * mixAmt * (3.0 - 2.0 * mixAmt);
    return mix(b1, b2, mt);
  }

  // ---- SDF primitives ----
  float sdSphere(vec3 p, float rad) { return length(p) - rad; }
  float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
  float sdOctahedron(vec3 p, float s) { p = abs(p); return (p.x + p.y + p.z - s) * 0.577; }

  // ---- nucleus fractal ----
  vec3 fractalShape(vec3 p, float time) {
    float m1 = sin(time * 0.13) * 0.5 + 0.5;
    float m2 = sin(time * 0.17 + 1.0) * 0.5 + 0.5;
    float m3 = sin(time * 0.11 + 2.0) * 0.5 + 0.5;
    float m4 = sin(time * 0.19 + 3.0) * 0.5 + 0.5;
    p.xz *= rot(time * 0.05);
    p.xy *= rot(time * 0.03);
    float scale = 1.0;
    float d = 1e10;
    float edgeAccum = 0.0;
    float iterColor = 0.0;
    for (int i = 0; i < 4; i++) {
      vec3 preAbs = p;
      p = abs(p);
      edgeAccum += exp(-min(min(abs(preAbs.x), abs(preAbs.y)), abs(preAbs.z)) * 8.0 / scale);
      if (p.x < p.y) p.xy = p.yx;
      if (p.x < p.z) p.xz = p.zx;
      if (p.y < p.z) p.yz = p.zy;
      p.xy *= rot(0.5 + m1 * 0.3);
      p.yz *= rot(0.4 + m2 * 0.2);
      float s = 2.0 + m3 * 0.3;
      p = p * s - vec3(1.0 + m4 * 0.5, 1.0, 1.0) * (s - 1.0);
      scale *= s;
      float shape;
      if (m1 < 0.33)      shape = sdBox(p, vec3(1.0)) / scale;
      else if (m1 < 0.66) shape = sdOctahedron(p, 1.5) / scale;
      else                shape = sdSphere(p, 1.2) / scale;
      if (shape < d) { d = shape; iterColor = float(i) / 4.0; }
    }
    return vec3(d, edgeAccum, iterColor);
  }

  float map(vec3 p) { return fractalShape(p, t).x; }

  vec3 calcNormal(vec3 p) {
    vec2 e = vec2(0.002, -0.002);
    return normalize(
      e.xyy * map(p + e.xyy) +
      e.yyx * map(p + e.yyx) +
      e.yxy * map(p + e.yxy) +
      e.xxx * map(p + e.xxx)
    );
  }

  vec3 palette(float x) {
    vec3 a = vec3(0.5);
    vec3 b = vec3(0.5);
    vec3 c = vec3(1.0);
    vec3 d = vec3(0.0, 0.1, 0.2);
    return a + b * cos(6.28318 * (c * x + d));
  }

  vec3 getParticlePos(float id, float time, float baseRadius, float speedMult) {
    float orbitRadius = baseRadius + id * 0.15;
    float speed = 0.06 * speedMult + id * 0.008;
    float phase = id * PI * 0.8;
    float angle = time * speed + phase;
    vec3 pos = vec3(cos(angle) * orbitRadius, 0.0, sin(angle) * orbitRadius);
    pos.xy *= rot(id * 0.4);
    pos.yz *= rot(id * 0.3);
    pos.y += sin(angle * 2.0 + id) * 0.3;
    return pos;
  }

  vec3 getElectronPos(float id, float time) {
    float orbitRadius = 5.0 + id * 0.3;
    float speed = 0.1 + id * 0.015;
    float phase = id * PI * 0.9 + PI * 0.5;
    float angle = time * speed + phase;
    vec3 pos = vec3(cos(angle) * orbitRadius, 0.0, sin(angle) * orbitRadius);
    pos.xy *= rot(id * 0.5 + 1.0);
    pos.yz *= rot(id * 0.4 + 0.5);
    return pos;
  }

  float lineGlow(vec3 ro, vec3 rd, vec3 a, vec3 b, float radius) {
    vec3 ba = b - a;
    vec3 oa = ro - a;
    float baba = dot(ba, ba);
    float bard = dot(ba, rd);
    float baoa = dot(ba, oa);
    float rdoa = dot(rd, oa);
    float denom = baba - bard * bard;
    if (abs(denom) < 0.0001) return 0.0;
    float th = (baoa * bard - rdoa * baba) / denom;
    float tl = (baoa + th * bard) / baba;
    tl = clamp(tl, 0.0, 1.0);
    th = max(th, 0.0);
    vec3 closestLine = a + ba * tl;
    vec3 closestRay = ro + rd * th;
    float dist = length(closestLine - closestRay);
    return exp(-dist * 25.0 / radius) * radius;
  }

  float particleGlow(vec3 ro, vec3 rd, vec3 particlePos, float radius) {
    vec3 toP = particlePos - ro;
    float alongRay = dot(toP, rd);
    if (alongRay < 0.0) return 0.0;
    vec3 closest = ro + rd * alongRay;
    float dist = length(particlePos - closest);
    float core = exp(-dist * 12.0 / radius);
    float glow = exp(-dist * 4.0 / radius) * 0.4;
    return core + glow;
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * r) / r.y;

    // Camera — uCamDist is the user-tuned base distance; zoomCycle still
    // breathes around it so the scene never feels static.
    float zoomCycle = sin(t * 0.05) * 0.5 + 0.5;
    float camDist = uCamDist + zoomCycle * 4.0;
    float camAngleH = t * 0.06;
    float camAngleV = sin(t * 0.04) * 0.3;
    vec3 ro = vec3(
      sin(camAngleH) * cos(camAngleV) * camDist,
      sin(camAngleV) * camDist * 0.5 + 1.0,
      cos(camAngleH) * cos(camAngleV) * camDist
    );
    vec3 ww = normalize(-ro);
    vec3 uu = normalize(cross(ww, vec3(0, 1, 0)));
    vec3 vv = cross(uu, ww);
    vec3 rd = normalize(uv.x * uu + uv.y * vv + uFov * ww);

    // Background
    vec3 col = vec3(0.015, 0.015, 0.03);
    col += 0.015 * palette(length(uv) * 0.3 + t * 0.01);

    // ---- particles + connections ----
    vec3 particleCol = vec3(0.0);
    vec3 lineCol = vec3(0.0);

    vec3 p0 = getParticlePos(0.0, t, 2.8, 1.0);
    vec3 p1 = getParticlePos(1.0, t, 2.8, 1.0);
    vec3 p2 = getParticlePos(2.0, t, 2.8, 1.0);
    vec3 p3 = getParticlePos(3.0, t, 2.8, 1.0);
    vec3 p4 = getParticlePos(4.0, t, 2.8, 1.0);
    vec3 p5 = getParticlePos(5.0, t, 2.8, 1.0);

    particleCol += palette(0.0 + t * 0.02) * particleGlow(ro, rd, p0, 0.35) * 0.7;
    particleCol += palette(0.1 + t * 0.02) * particleGlow(ro, rd, p1, 0.35) * 0.7;
    particleCol += palette(0.2 + t * 0.02) * particleGlow(ro, rd, p2, 0.35) * 0.7;
    particleCol += palette(0.3 + t * 0.02) * particleGlow(ro, rd, p3, 0.35) * 0.7;
    particleCol += palette(0.4 + t * 0.02) * particleGlow(ro, rd, p4, 0.35) * 0.7;
    particleCol += palette(0.5 + t * 0.02) * particleGlow(ro, rd, p5, 0.35) * 0.7;

    lineCol += palette(0.05 + t * 0.02) * lineGlow(ro, rd, p0, p1, 0.8) * 0.35;
    lineCol += palette(0.10 + t * 0.02) * lineGlow(ro, rd, p1, p2, 0.8) * 0.35;
    lineCol += palette(0.15 + t * 0.02) * lineGlow(ro, rd, p2, p3, 0.8) * 0.35;
    lineCol += palette(0.20 + t * 0.02) * lineGlow(ro, rd, p3, p4, 0.8) * 0.35;
    lineCol += palette(0.25 + t * 0.02) * lineGlow(ro, rd, p4, p5, 0.8) * 0.35;
    lineCol += palette(0.30 + t * 0.02) * lineGlow(ro, rd, p5, p0, 0.8) * 0.35;
    lineCol += palette(0.10 + t * 0.015) * lineGlow(ro, rd, p0, p3, 0.6) * 0.2;
    lineCol += palette(0.20 + t * 0.015) * lineGlow(ro, rd, p1, p4, 0.6) * 0.2;
    lineCol += palette(0.30 + t * 0.015) * lineGlow(ro, rd, p2, p5, 0.6) * 0.2;

    float pulse0 = sin(t * 0.5) * 0.3 + 0.7;
    float pulse1 = sin(t * 0.5 + 1.0) * 0.3 + 0.7;
    lineCol += palette(t * 0.02)       * lineGlow(ro, rd, p0, vec3(0.0), 0.4) * 0.15 * pulse0;
    lineCol += palette(t * 0.02 + 0.2) * lineGlow(ro, rd, p2, vec3(0.0), 0.4) * 0.15 * pulse1;

    // ---- electrons ----
    vec3 e0 = getElectronPos(0.0, t);
    vec3 e1 = getElectronPos(1.0, t);
    vec3 e2 = getElectronPos(2.0, t);
    vec3 e3 = getElectronPos(3.0, t);
    vec3 e4 = getElectronPos(4.0, t);

    particleCol += uElectronColor * particleGlow(ro, rd, e0, 0.2) * 0.9;
    particleCol += uElectronColor * particleGlow(ro, rd, e1, 0.2) * 0.9;
    particleCol += uElectronColor * particleGlow(ro, rd, e2, 0.2) * 0.9;
    particleCol += uElectronColor * particleGlow(ro, rd, e3, 0.2) * 0.9;
    particleCol += uElectronColor * particleGlow(ro, rd, e4, 0.2) * 0.9;

    vec3 eLineCol = uElectronColor * 0.6;
    lineCol += eLineCol * lineGlow(ro, rd, e0, e1, 0.5) * 0.25;
    lineCol += eLineCol * lineGlow(ro, rd, e1, e2, 0.5) * 0.25;
    lineCol += eLineCol * lineGlow(ro, rd, e2, e3, 0.5) * 0.25;
    lineCol += eLineCol * lineGlow(ro, rd, e3, e4, 0.5) * 0.25;
    lineCol += eLineCol * lineGlow(ro, rd, e4, e0, 0.5) * 0.25;

    // ---- nucleus raymarch ----
    vec3 nucleusCol = vec3(0.0);
    float glowAccum = 0.0;
    float depth = 0.0;
    float lastD = 1000.0;
    float stepsSinceHit = 100.0;

    for (int i = 0; i < 60; i++) {
      if (depth > 25.0) break;
      vec3 p = ro + rd * depth;
      vec3 result = fractalShape(p, t);
      float d = result.x;
      glowAccum += exp(-abs(d) * 10.0) * 0.025;
      stepsSinceHit += 1.0;
      bool surfaceHit = abs(d) < 0.005;
      bool crossedSurface = lastD * d < 0.0;
      if ((surfaceHit || crossedSurface) && stepsSinceHit > 2.0) {
        stepsSinceHit = 0.0;
        vec3 n = calcNormal(p);
        float fresnel = pow(1.0 - abs(dot(n, -rd)), 2.0);
        float wire = clamp(fresnel * 0.8 + result.y * 0.25, 0.0, 1.0);
        float colorVal = result.z * 0.5 + t * 0.02;
        vec3 wireCol = palette(colorVal);
        float depthFade = exp(-depth * 0.08);
        vec3 layerCol = wireCol * wire * 1.2;
        layerCol += vec3(1.0) * pow(wire, 3.0) * 0.2;
        layerCol *= depthFade;
        float alpha = (wire * 0.5 + 0.1) * depthFade;
        nucleusCol = mix(nucleusCol, blendMix(nucleusCol, layerCol, t), alpha);
      }
      lastD = d;
      depth += max(abs(d) * 0.8, 0.02);
    }

    vec3 nucleusGlow = palette(t * 0.03) * glowAccum;
    nucleusCol = blendMix(nucleusCol, nucleusGlow, t);

    // ---- composite with user-tuned intensities ----
    col = blendMix(col, lineCol * uLineGlow, t);
    col = blendMix(col, particleCol * 0.9 * uParticleGlow, t);
    col = blendMix(col, nucleusCol * uNucleusIntensity, t);

    float centralGlow = exp(-length(uv) * 1.5) * 0.12;
    col += palette(t * 0.015) * centralGlow;

    float ring1 = abs(length(uv) - 0.35);
    float ring2 = abs(length(uv) - 0.55);
    col += vec3(0.15, 0.2, 0.3) * exp(-ring1 * 40.0) * 0.12;
    col += vec3(0.10, 0.15, 0.25) * exp(-ring2 * 40.0) * 0.08;

    col *= 1.0 - uVignette * dot(uv, uv);

    // tone map + gamma
    col = col / (0.9 + col);
    col = pow(col, vec3(0.45));

    gl_FragColor = vec4(col, 1.0);
  }
`;

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(vs, gl.VERTEX_SHADER));
gl.attachShader(prog, compile(fs, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const pLoc = gl.getAttribLocation(prog, 'p');
const tLoc = gl.getUniformLocation(prog, 't');
const rLoc = gl.getUniformLocation(prog, 'r');
const camDistLoc        = gl.getUniformLocation(prog, 'uCamDist');
const fovLoc            = gl.getUniformLocation(prog, 'uFov');
const particleGlowLoc   = gl.getUniformLocation(prog, 'uParticleGlow');
const lineGlowLoc       = gl.getUniformLocation(prog, 'uLineGlow');
const nucleusLoc        = gl.getUniformLocation(prog, 'uNucleusIntensity');
const vignetteLoc       = gl.getUniformLocation(prog, 'uVignette');
const electronColorLoc  = gl.getUniformLocation(prog, 'uElectronColor');

function resize() {
  // Host samples this canvas at 1x and downscales; allocating at devicePixelRatio
  // wastes 4x GPU on Retina. The js-animation iframe shim already forces
  // devicePixelRatio to 1 — fall back to 1 explicitly for any context that
  // didn't get the shim (standalone preview in a browser).
  const dpr = 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

// Integrated time accumulator. The user-facing `speed` param scales how
// fast `t` advances; if we just multiplied by speed at sample time the
// phase would jump every slider tick. Integrating preserves continuity.
let lastFrame = performance.now();
let accumT = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); // clamp dt to avoid huge jumps on tab focus
  lastFrame = now;
  const sp = window.shaderParams;
  accumT += dt * (sp.speed ?? 1.0);

  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(tLoc, accumT);
  gl.uniform2f(rLoc, canvas.width, canvas.height);
  gl.uniform1f(camDistLoc,      sp.cameraDistance ?? 8.0);
  gl.uniform1f(fovLoc,          sp.fov ?? 1.6);
  gl.uniform1f(particleGlowLoc, sp.particleGlow ?? 1.0);
  gl.uniform1f(lineGlowLoc,     sp.lineGlow ?? 1.0);
  gl.uniform1f(nucleusLoc,      sp.nucleusIntensity ?? 1.0);
  gl.uniform1f(vignetteLoc,     sp.vignette ?? 0.35);
  const ec = sp.electronColor || [0.4, 0.7, 1.0];
  gl.uniform3f(electronColorLoc, ec[0], ec[1], ec[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
