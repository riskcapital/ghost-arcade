<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <title>Ghost Arcade Pro</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }

      /* ======== SPLASH SCREEN ======== */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        transition: opacity 0.5s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Wordmark draws itself: one continuous stroke chase across the
         compound path (pathLength-normalized), then the fill blooms in
         and the circuit nodes pop, then the whole mark fades to loop.
         The mark is src/lib/brand/wordmark.svg, inlined at the marker
         below by vite.config.ts; its colours live in that file. */
      #splash svg {
        width: min(620px, 74vw);
        height: auto;
        margin-bottom: 36px;
        overflow: visible;
      }
      #splash .wm-letters {
        fill-opacity: 0;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: splash-draw 5.2s ease-in-out infinite;
      }
      #splash .wm-nodes {
        opacity: 0;
        animation: splash-nodes 5.2s ease-in-out infinite;
      }
      @keyframes splash-draw {
        0%   { stroke-dashoffset: 1200; fill-opacity: 0; opacity: 1; }
        52%  { stroke-dashoffset: 0;    fill-opacity: 0; opacity: 1; }
        68%  { stroke-dashoffset: 0;    fill-opacity: 1; opacity: 1; }
        93%  { stroke-dashoffset: 0;    fill-opacity: 1; opacity: 1; }
        100% { stroke-dashoffset: 0;    fill-opacity: 1; opacity: 0; }
      }
      @keyframes splash-nodes {
        0%, 46%  { opacity: 0; }
        64%, 93% { opacity: 1; }
        100%     { opacity: 0; }
      }
      #splash .splash-text {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-size: 12px;
        color: #667380;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      #splash .splash-bar-track {
        width: 200px;
        height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      #splash .splash-bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, #f6fafd, #92aabf);
        border-radius: 2px;
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — shown instantly, removed when Svelte app is ready -->
    <div id="splash">
      <!-- wordmark -->
      <div class="splash-text">Loading</div>
      <div class="splash-bar-track">
        <div class="splash-bar"></div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Register service worker for PWA installability (mobile only)
      if ('serviceWorker' in navigator && window.location.hash.includes('mobile')) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
