<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Geometry — Endless</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #three-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #three-fg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="three-bg"></div>
    <div id="three-fg"></div>

    <script>
        // ============================================
        // PURE GEOMETRY — ENDLESS
        // Matches v10 pure geometry phase exactly
        // ============================================

        let sceneBg, cameraBg, rendererBg, geometriesBg = [];
        let sceneFg, cameraFg, rendererFg, geometriesFg = [];

        function init() {
            // Background scene
            sceneBg = new THREE.Scene();
            cameraBg = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            cameraBg.position.z = 80;
            rendererBg = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            rendererBg.setSize(window.innerWidth, window.innerHeight);
            rendererBg.setClearColor(0x000000, 1);
            document.getElementById('three-bg').appendChild(rendererBg.domElement);

            // Foreground scene
            sceneFg = new THREE.Scene();
            cameraFg = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            cameraFg.position.z = 30;
            rendererFg = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            rendererFg.setSize(window.innerWidth, window.innerHeight);
            rendererFg.setClearColor(0x000000, 0);
            document.getElementById('three-fg').appendChild(rendererFg.domElement);

            // Lighting - exactly as v10
            sceneBg.add(new THREE.AmbientLight(0x404040, 0.3));
            const l1 = new THREE.PointLight(0x00D9FF, 0.8, 200); l1.position.set(40, 40, 40); sceneBg.add(l1);
            const l2 = new THREE.PointLight(0xFF006E, 0.8, 200); l2.position.set(-40, -40, 40); sceneBg.add(l2);
            const l3 = new THREE.PointLight(0x9D4EDD, 0.6, 200); l3.position.set(0, 40, -40); sceneBg.add(l3);
            sceneFg.add(new THREE.AmbientLight(0x404040, 0.4));
            const lf = new THREE.PointLight(0x9D4EDD, 1, 100); lf.position.set(0, 0, 20); sceneFg.add(lf);

            // Seed with initial geometry spread across the viewport
            for (let i = 0; i < 120; i++) {
                addBackgroundGeometry();
            }
            for (let i = 0; i < 50; i++) {
                addForegroundGeometry();
            }

            animate();
        }

        function addBackgroundGeometry() {
            const colors = [0x00D9FF, 0x9D4EDD, 0xFF006E, 0xFF6B00, 0x00F5A0];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            // Size scaled as if at end of v10 (progress ~0.8)
            const size = (3 + Math.random() * 8) * 3;
            
            let geometry;
            const type = Math.floor(Math.random() * 10);
            switch(type) {
                case 0: geometry = new THREE.BoxGeometry(size, size, size); break;
                case 1: geometry = new THREE.BoxGeometry(size * 2.5, size * 0.15, size * 2.5); break;
                case 2: geometry = new THREE.BoxGeometry(size * 0.15, size * 3, size * 0.15); break;
                case 3: geometry = new THREE.TorusGeometry(size * 0.7, size * 0.15, 12, 24); break;
                case 4: geometry = new THREE.OctahedronGeometry(size * 0.8); break;
                case 5: geometry = new THREE.TetrahedronGeometry(size); break;
                case 6: geometry = new THREE.IcosahedronGeometry(size * 0.6); break;
                case 7: geometry = new THREE.DodecahedronGeometry(size * 0.5); break;
                case 8: geometry = new THREE.TorusKnotGeometry(size * 0.5, size * 0.15, 64, 8); break;
                case 9: geometry = new THREE.ConeGeometry(size * 0.5, size * 1.2, 8); break;
            }
            
            const isWire = Math.random() < 0.55;
            const material = isWire 
                ? new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.6, wireframe: true, emissive: color, emissiveIntensity: 0.15 }) 
                : new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.35, shininess: 100, emissive: color, emissiveIntensity: 0.1 });
            
            const mesh = new THREE.Mesh(geometry, material);
            
            // Spread across full vertical range for seeding
            mesh.position.set(
                (Math.random() - 0.5) * 160,
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 180
            );
            
            mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, 0);
            mesh.userData = { 
                speedY: 0.05 + Math.random() * 0.08, 
                speedX: (Math.random() - 0.5) * 0.012, 
                rotSpeedX: (Math.random() - 0.5) * 0.0025, 
                rotSpeedY: (Math.random() - 0.5) * 0.004, 
                rotSpeedZ: (Math.random() - 0.5) * 0.0015 
            };
            
            sceneBg.add(mesh);
            geometriesBg.push(mesh);
        }

        function addForegroundGeometry() {
            const colors = [0x00D9FF, 0x9D4EDD, 0xFF006E, 0xFF6B00, 0x00F5A0];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = 0.25 + Math.random() * 0.7;
            
            let geometry;
            const type = Math.floor(Math.random() * 6);
            switch(type) {
                case 0: geometry = new THREE.TorusGeometry(size, size * 0.3, 8, 16); break;
                case 1: geometry = new THREE.OctahedronGeometry(size); break;
                case 2: geometry = new THREE.TetrahedronGeometry(size); break;
                case 3: geometry = new THREE.BoxGeometry(size, size, size); break;
                case 4: geometry = new THREE.IcosahedronGeometry(size * 0.8); break;
                case 5: geometry = new THREE.DodecahedronGeometry(size * 0.7); break;
            }
            
            const isWire = Math.random() < 0.45;
            const material = isWire 
                ? new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.65, wireframe: true }) 
                : new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.45, shininess: 150, emissive: color, emissiveIntensity: 0.2 });
            
            const mesh = new THREE.Mesh(geometry, material);
            
            // Spread across full vertical range for seeding
            mesh.position.set(
                (Math.random() - 0.5) * 45,
                (Math.random() - 0.5) * 56,
                (Math.random() - 0.5) * 25
            );
            
            mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, 0);
            mesh.userData = { 
                speedY: 0.025 + Math.random() * 0.04, 
                speedX: (Math.random() - 0.5) * 0.015, 
                rotSpeedX: (Math.random() - 0.5) * 0.008, 
                rotSpeedY: (Math.random() - 0.5) * 0.012, 
                rotSpeedZ: (Math.random() - 0.5) * 0.006, 
                oscillateX: Math.random() * Math.PI * 2, 
                oscillateSpeed: 0.4 + Math.random() * 0.8 
            };
            
            sceneFg.add(mesh);
            geometriesFg.push(mesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Update background geometry - exactly as v10
            geometriesBg.forEach(g => { 
                g.position.y += g.userData.speedY; 
                g.position.x += g.userData.speedX || 0; 
                g.rotation.x += g.userData.rotSpeedX; 
                g.rotation.y += g.userData.rotSpeedY; 
                g.rotation.z += g.userData.rotSpeedZ; 
                
                // Reset when off screen top - seamless recycling
                if (g.position.y > 110) { 
                    g.position.y = -90; 
                    g.position.x = (Math.random() - 0.5) * 160; 
                } 
            });
            
            // Update foreground geometry - exactly as v10
            geometriesFg.forEach(g => { 
                g.position.y += g.userData.speedY; 
                g.position.x += Math.sin(time * g.userData.oscillateSpeed + g.userData.oscillateX) * 0.015; 
                g.rotation.x += g.userData.rotSpeedX; 
                g.rotation.y += g.userData.rotSpeedY; 
                g.rotation.z += g.userData.rotSpeedZ; 
                
                // Reset when off screen top - seamless recycling
                if (g.position.y > 28) { 
                    g.position.y = -28; 
                    g.position.x = (Math.random() - 0.5) * 45; 
                } 
            });
            
            // Camera movement - exactly as v10
            const ct = time * 0.05;
            cameraBg.position.set(Math.sin(ct * 0.5) * 6, Math.cos(ct * 0.3) * 4, 80 + Math.sin(ct * 0.2) * 8); 
            cameraBg.lookAt(0, 0, 0);
            cameraFg.position.set(Math.sin(ct * 0.6) * 2, Math.cos(ct * 0.35) * 1.5, 30); 
            cameraFg.lookAt(0, 0, 0);
            
            rendererBg.render(sceneBg, cameraBg);
            rendererFg.render(sceneFg, cameraFg);
        }

        window.addEventListener('resize', () => {
            cameraBg.aspect = window.innerWidth / window.innerHeight;
            cameraBg.updateProjectionMatrix();
            rendererBg.setSize(window.innerWidth, window.innerHeight);
            
            cameraFg.aspect = window.innerWidth / window.innerHeight;
            cameraFg.updateProjectionMatrix();
            rendererFg.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
