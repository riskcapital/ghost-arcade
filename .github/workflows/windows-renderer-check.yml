name: Windows renderer checks

on:
  pull_request:
    paths:
      - 'native-renderer/**'
      - 'electron/conversion-ffmpeg.cjs'
      - 'electron/video-converter-*'
      - 'scripts/ensure-windows-ffmpeg.mjs'
      - 'build-resources/windows-ffmpeg.json'
      - 'build-resources/beforePack.cjs'
      - 'build-resources/afterPack.cjs'
      - 'electron-builder.yml'
      - 'src/lib/video/**'
      - '.github/workflows/windows-renderer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hap-conversion:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run windows:ffmpeg
      - run: node scripts/ensure-windows-ffmpeg.mjs --verify
      - run: npx vitest run src/lib/video/conversionFfmpeg.test.ts src/lib/video/videoConverter.native.test.ts
  compile-and-unit-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: windows-renderer-check-${{ hashFiles('native-renderer/Cargo.lock') }}
      # GitHub's hosted VM cannot qualify hardware video. Compile and link
      # every test, then run the pure policy/metadata tests. The runtime suites
      # and hardware benchmark must run on a physical Windows GPU.
      - name: Compile and link renderer tests
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked --no-run
      - name: Test Windows video policies
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked windows_video
