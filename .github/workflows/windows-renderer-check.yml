name: Windows renderer checks

on:
  push:
    branches:
      - 'ci/windows-**'
  pull_request:
    paths:
      - 'native-renderer/**'
      - 'phone-server/**'
      - 'server/**'
      - 'src/lib/remote/**'
      - 'scripts/build-phone-server.mjs'
      - 'scripts/test-remote-rust.mjs'
      - 'electron/native/**'
      - 'electron/conversion-ffmpeg.cjs'
      - 'electron/video-converter-*'
      - 'scripts/ensure-windows-ffmpeg.mjs'
      - 'build-resources/windows-ffmpeg.json'
      - '.cargo/**'
      - 'scripts/windows-core-imports.mjs'
      - 'scripts/native-core-start-check.mjs'
      - 'build-resources/beforePack.cjs'
      - 'build-resources/afterPack.cjs'
      - 'electron-builder.yml'
      - 'src/lib/video/**'
      - '.github/workflows/windows-renderer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hap-conversion:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run windows:ffmpeg
      - run: node scripts/ensure-windows-ffmpeg.mjs --verify
      - run: npx vitest run src/lib/video/conversionFfmpeg.test.ts src/lib/video/videoConverter.native.test.ts src/lib/output/slicePresentation.test.ts
  native-addons:
    # The C++ addons (the Windows presenter with its Screen pump, readback,
    # capture) only build with the Windows toolchain. Same steps as the
    # release build, so a change to them fails here rather than at release.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install native addon dependencies
        run: npm ci --ignore-scripts
        working-directory: electron/native
      - name: Build native addons
        run: npm run build -- --rebuild
        working-directory: electron/native
      - name: Test the Screen and deck monitor pumps
        run: npx vitest run src/lib/output/sliceNativePump.test.ts src/lib/renderer/deckMonitorPump.test.ts src/lib/output/slicePresentation.test.ts
  core-starts-anywhere:
    # The release core must start on any Windows 10 or 11 PC. Built the way
    # the release builds it (npm run native:build: cargo --release plus the
    # DXC DLLs beside it), then its import table is checked and it is started.
    # The C runtime is linked in (.cargo/config.toml) and Media Foundation is
    # loaded on first use, so neither the Visual C++ Redistributable nor the
    # Media Feature Pack is needed. A hosted runner has the Redistributable
    # installed, so the import check is what proves it; starting the core
    # proves the static runtime works.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: windows-core-release-${{ hashFiles('native-renderer/Cargo.lock', '.cargo/config.toml') }}
      - name: Build the render core as the release does
        run: npm run native:build
      - name: Check what the core needs to start
        run: node scripts/windows-core-imports.mjs native-renderer/target/release/ghost-render-core.exe --info native-renderer/target/release/dxcompiler.dll native-renderer/target/release/dxil.dll
      - name: Start the core
        run: node scripts/native-core-start-check.mjs
      - name: Test the import check
        run: npx vitest run src/lib/renderer/windowsCoreImports.test.ts src/lib/renderer/nativeCoreExit.test.ts
  raster-compare:
    # The compositor scene set drawn by the raster and the legacy compositor,
    # compared pixel for pixel (within one 8-bit step). The hosted runner has
    # no GPU: the core falls back to the D3D12 software adapter (WARP,
    # "Microsoft Basic Render Driver"). Without float32 blending the raster
    # compositor is not made and the trace says so.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: windows-core-release-${{ hashFiles('native-renderer/Cargo.lock', '.cargo/config.toml') }}
      - name: Build the render core as the release does
        run: npm run native:build
      - name: Scenes, raster against legacy
        id: scenes
        continue-on-error: true
        env:
          GA_CORE_COMPOSITOR_BENCH_TRACE: ${{ github.workspace }}/raster-scenes.txt
        run: npx vitest run --config vitest.native.config.ts src/lib/renderer/compositorBench.runtime.native.test.ts -t "draws every scene the same with the raster compositor"
      - name: Composite views, raster against legacy
        id: views
        continue-on-error: true
        env:
          GA_CORE_COMPOSITOR_BENCH_TRACE: ${{ github.workspace }}/raster-views.txt
        run: npx vitest run --config vitest.native.config.ts src/lib/renderer/compositorBench.runtime.native.test.ts -t "draws the composite views the same with the raster compositor"
      - name: Verdict
        if: always()
        shell: bash
        run: |
          {
            echo "## Raster compositor against legacy (WARP)"
            echo "scenes: ${{ steps.scenes.outcome }}, views: ${{ steps.views.outcome }}"
            echo '```'; cat raster-scenes.txt 2>/dev/null || echo "no scene trace"; echo '```'
            echo '```'; cat raster-views.txt 2>/dev/null || echo "no view trace"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat raster-scenes.txt raster-views.txt 2>/dev/null || true
          test "${{ steps.scenes.outcome }}" = "success" && test "${{ steps.views.outcome }}" = "success"
  compile-and-unit-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: windows-renderer-check-${{ hashFiles('native-renderer/Cargo.lock') }}
      # GitHub's hosted VM cannot qualify hardware video. Compile and link
      # every test, then run the pure policy/metadata tests. The runtime suites
      # and hardware benchmark must run on a physical Windows GPU.
      - name: Compile and link renderer tests
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked --no-run
      - name: Test Windows video policies
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked windows_video
      - name: Test native Screen presentation capability
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked slice_presentation
      - name: Test the HAP reader (variants, edit lists, packet checks)
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked hap_video
      # Written to pass with or without Media Foundation (Windows N and
      # Server images can lack it) and with no display attached.
      - name: Test Media Foundation loading, the frame counter and display rates
        run: cargo test --manifest-path native-renderer/Cargo.toml --locked -- windows_media_foundation core_frame_counter windows_display_rate
  phone-server:
    # The phone remote server (phone-server/, Rust): its own tests, then the
    # remote server suites against both servers on Windows, so a Windows-only
    # difference (paths, sockets) in either fails here. Linked like the core
    # (.cargo/config.toml), so it starts without the Visual C++ runtime.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            phone-server/target
          key: windows-phone-server-${{ hashFiles('phone-server/Cargo.lock', '.cargo/config.toml') }}
      - name: Test the phone server
        run: cargo test --manifest-path phone-server/Cargo.toml --locked
      - name: Remote server tests on the JS server
        run: npx vitest run src/lib/remote
      - name: Remote server tests on the Rust server
        run: npm run test:remote:rust
      - name: Check what the phone server needs to start
        run: node scripts/windows-core-imports.mjs phone-server/target/release/ghost-phone-server.exe
