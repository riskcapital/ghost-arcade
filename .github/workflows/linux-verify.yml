name: Linux verify

# Proves the desktop app works on real Ubuntu: builds the native render core,
# runs the Rust and vitest suites, then launches the real app under Xvfb on
# software Vulkan (lavapipe) and drives it with scripts/linux-smoke.mjs.
#
# The runner has no GPU. Frame times here say nothing about a real machine,
# and a real GPU driver (NVIDIA/AMD/Intel), several monitors, real audio
# devices and real projectors are not covered.

on:
  push:
    branches:
      - 'ci/linux-**'
      - 'integrate/desktop-1008'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build-time libraries: cpal's ALSA backend links libasound.
  APT_BUILD: libasound2-dev pkg-config
  # What the app and the core load at runtime, plus the virtual display, a
  # window manager (fullscreen needs one), software Vulkan and the tools the
  # smoke run measures with.
  GA_TEST_SOFTWARE_VULKAN: '1'
  APT_RUNTIME: >-
    xvfb openbox dbus-x11 xdotool x11-utils imagemagick ffmpeg
    mesa-vulkan-drivers libvulkan1 vulkan-tools
    libxkbcommon-x11-0 libasound2t64 libgtk-3-0t64 libnss3 libxss1 libxtst6 libnotify4
    libatspi2.0-0t64 libsecret-1-0 libgbm1 libfuse2t64

jobs:
  # ── Native render core (release binary every other job uses) ─────────────
  core:
    # Compile against glibc 2.35 so the packaged core also runs on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: linux-verify-core-ubuntu22-release-${{ hashFiles('native-renderer/Cargo.lock') }}
          restore-keys: linux-verify-core-ubuntu22-release-
      - name: Build native render core
        run: node scripts/build-native-core.mjs --arch=host
      - name: Record what the core links against
        run: |
          file native-renderer/target/release/ghost-render-core
          ldd native-renderer/target/release/ghost-render-core | tee core-ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-render-core-linux-x64
          path: |
            native-renderer/target/release/ghost-render-core
            core-ldd.txt
          retention-days: 7

  # ── Rust unit tests ─────────────────────────────────────────────────────
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-renderer/target
          key: linux-verify-core-test-${{ hashFiles('native-renderer/Cargo.lock') }}
          restore-keys: linux-verify-core-test-
      - name: cargo test (npm run native:test)
        run: xvfb-run -a npm run native:test

  # ── Type check ──────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:desktop

  # ── vitest + the real app under Xvfb ────────────────────────────────────
  app:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME
      - run: npm ci
      # Only the Ableton Link addon builds on Linux; Spout, Syphon and the
      # preview/capture addons are Windows- and macOS-only, and NDI needs an
      # SDK this job does not install.
      - name: Build native addons
        run: npm ci --ignore-scripts && npm run build -- --rebuild
        working-directory: electron/native
      - uses: actions/download-artifact@v4
        with:
          name: ghost-render-core-linux-x64
          path: .
      - name: Make the core executable
        run: chmod +x native-renderer/target/release/ghost-render-core && mkdir -p linux-smoke-out
      - name: Vulkan driver on this runner
        run: |
          xvfb-run -a vulkaninfo --summary | tee linux-smoke-out/vulkaninfo.txt || true
          aplay -l 2>&1 | tee linux-smoke-out/alsa-devices.txt || true

      # Ubuntu 24.04 blocks unprivileged user namespaces, so an unpackaged
      # Electron needs its setuid sandbox helper, which is what the .deb's
      # post-install script sets up on a real machine.
      - name: Give the unpackaged Electron its sandbox helper
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: vitest (every suite; native GPU tests run on lavapipe)
        id: vitest
        continue-on-error: true
        run: xvfb-run -a npx vitest run --maxWorkers=1 --no-file-parallelism --retry=2 --testTimeout=60000 --hookTimeout=120000 --reporter=default --reporter=json --outputFile.json=linux-smoke-out/vitest.json

      - name: Start the dev server
        run: |
          npm run dev > linux-smoke-out/vite.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:1420/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:1420/ > /dev/null
      - name: Smoke run (real app, Xvfb + openbox, software Vulkan)
        id: smoke
        continue-on-error: true
        timeout-minutes: 30
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            openbox > linux-smoke-out/openbox.log 2>&1 &
            sleep 1
            node scripts/linux-smoke.mjs --dev-url http://localhost:1420 --out linux-smoke-out
          '
      - name: Smoke summary
        if: always()
        run: |
          { echo "## Linux smoke run (unpackaged app)"; cat linux-smoke-out/summary.md 2>/dev/null || echo "no summary written"; } >> "$GITHUB_STEP_SUMMARY"
          echo "---- app.log (tail) ----"; tail -n 150 linux-smoke-out/app.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-out
          path: |
            linux-smoke-out
            !linux-smoke-out/profile
          retention-days: 14
      - name: Verdict
        if: always()
        run: |
          echo "vitest: ${{ steps.vitest.outcome }}  smoke: ${{ steps.smoke.outcome }}"
          test "${{ steps.vitest.outcome }}" = "success" && test "${{ steps.smoke.outcome }}" = "success"

  # ── AppImage + deb, and the packaged app under Xvfb ─────────────────────
  package:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME rpm fakeroot dpkg
      - run: npm ci
      - name: Build native addons
        run: npm ci --ignore-scripts && npm run build -- --rebuild
        working-directory: electron/native
      - uses: actions/download-artifact@v4
        with:
          name: ghost-render-core-linux-x64
          path: .
      - name: Make the core executable
        run: chmod +x native-renderer/target/release/ghost-render-core && mkdir -p linux-package-out
      - name: Build frontend
        run: npm run build
      - name: Package (AppImage + deb)
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the packages
        id: packages
        continue-on-error: true
        run: node scripts/linux-package-check.mjs dist-electron linux-package-out
      - name: Install deb in clean Ubuntu 22.04 and 24.04 containers
        id: clean_install
        continue-on-error: true
        run: |
          bash scripts/linux-clean-install.sh dist-electron 22.04
          bash scripts/linux-clean-install.sh dist-electron 24.04
      - name: Smoke run of the packaged AppImage
        id: appimage
        continue-on-error: true
        timeout-minutes: 20
        run: |
          APPIMAGE=$(ls dist-electron/*.AppImage | head -n 1)
          chmod +x "$APPIMAGE"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" bash -c "
            openbox > linux-package-out/openbox.log 2>&1 &
            sleep 1
            node scripts/linux-smoke.mjs --exec '$APPIMAGE' --exec-arg --appimage-extract-and-run --only a,b,h --out linux-package-out/appimage-smoke
          "
      - name: Package summary
        if: always()
        run: |
          { echo "## Linux packages"; cat linux-package-out/packages.md 2>/dev/null || echo "no package report"; echo; echo "## Packaged AppImage smoke run"; cat linux-package-out/appimage-smoke/summary.md 2>/dev/null || echo "no summary written"; } >> "$GITHUB_STEP_SUMMARY"
          echo "---- app.log (tail) ----"; tail -n 150 linux-package-out/appimage-smoke/app.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package-out
          path: |
            linux-package-out
            !linux-package-out/**/profile
          retention-days: 14
      # The installers themselves, so a person with a Linux desktop can try
      # exactly what this run verified.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghost-arcade-linux-installers
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
          retention-days: 14
          compression-level: 0
      - name: Verdict
        if: always()
        run: |
          echo "packages: ${{ steps.packages.outcome }}  appimage: ${{ steps.appimage.outcome }}"
          test "${{ steps.packages.outcome }}" = "success" && test "${{ steps.clean_install.outcome }}" = "success" && test "${{ steps.appimage.outcome }}" = "success"
