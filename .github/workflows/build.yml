name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.1)'
        required: false

permissions:
  contents: write

jobs:
  # Pre-create the empty release on the cross-repo target. softprops/
  # action-gh-release@v2 can auto-create releases ONLY on the same repo
  # the workflow is running in — when targeting a different repo via
  # `repository:`, the release MUST already exist before the upload
  # step runs, or every upload attempt 400s.
  #
  # This job runs ONCE, idempotently (gh release create -F /dev/null
  # exits 0 if the release already exists). Both build jobs declare
  # `needs: create-release` so they only kick off after the release is
  # there, eliminating the parallel-creation race too.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create empty release on ghost-arcade-releases (idempotent)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo riskcapital/ghost-arcade-releases > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --repo riskcapital/ghost-arcade-releases \
              --title "Ghost Arcade ${{ github.ref_name }}" \
              --notes "Signed Windows installer + notarized macOS DMGs + Linux AppImage/deb uploaded by CI." \
              --target main
            echo "Release ${{ github.ref_name }} created"
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install native addon dependencies
        run: npm ci
        working-directory: electron/native

      # NDI Advanced SDK — required to build the ndi_addon. The SDK
      # download itself is gated by NewTek's terms, so CI fetches it
      # from the org's own private storage URL (secrets.NDI_SDK_WIN_URL).
      # When the secret isn't set the build SKIPS the NDI addon
      # silently — Spout / Syphon stay functional, just no NDI.
      - name: Install NDI Advanced SDK (Windows)
        if: ${{ env.NDI_SDK_WIN_URL != '' }}
        shell: pwsh
        env:
          NDI_SDK_WIN_URL: ${{ secrets.NDI_SDK_WIN_URL }}
        run: |
          $url = $env:NDI_SDK_WIN_URL
          $installer = "$env:RUNNER_TEMP\NDI-SDK.exe"
          Write-Host "Downloading NDI SDK from $url..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Write-Host "Installing silently..."
          Start-Process -FilePath $installer -ArgumentList "/SILENT", "/SUPPRESSMSGBOXES" -Wait
          # Confirm the expected install path resolved (the CMake detection
          # logic checks these exact paths).
          $sdk = "C:\Program Files\NDI\NDI Advanced SDK"
          if (-Not (Test-Path "$sdk\Include\Processing.NDI.Lib.h")) {
            $sdk = "C:\Program Files\NDI\NDI SDK"
          }
          Write-Host "NDI SDK installed:" (Test-Path "$sdk\Include\Processing.NDI.Lib.h")

      - name: Build Spout native addon
        run: npm run build
        working-directory: electron/native

      - name: Build frontend
        run: npm run build

      # Azure Trusted Signing — installs the PowerShell module that
      # electron-builder's azureSignOptions invokes to sign the .exe.
      # Authentication uses Service Principal env vars passed below.
      - name: Install Trusted Signing PowerShell module
        shell: pwsh
        run: |
          Install-Module -Name TrustedSigning -RequiredVersion 0.4.1 -Force -Scope CurrentUser -AllowClobber
          Get-Module -ListAvailable -Name TrustedSigning | Format-List Name, Version

      - name: Build Electron (Windows NSIS, signed via Azure Trusted Signing)
        # --publish never disables electron-builder's auto-publish step. With
        # GH_TOKEN in env it would otherwise try to push assets to the SOURCE
        # repo (riskcapital/ghost-arcade) on top of softprops's cross-repo
        # upload to ghost-arcade-releases. Two uploaders racing on the same
        # asset name caused random 502s on overwrite-delete (saw it brick the
        # v0.5.5 macOS job three times in a row). softprops handles publishing.
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload Windows installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: riskcapital/ghost-arcade-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Syphon is Apple's OpenGL texture-sharing framework — required for
      # inter-app video send/receive on macOS (Spout equivalent on Windows).
      # Cached via GitHub Actions so we only download once per runner image.
      - name: Install Syphon framework
        run: |
          SYPHON_VER="v5"
          SYPHON_URL="https://github.com/Syphon/Syphon-Framework/releases/download/5/Syphon.SDK.5.zip"
          curl -L -o /tmp/syphon.zip "$SYPHON_URL"
          unzip -q /tmp/syphon.zip -d /tmp/syphon-sdk
          sudo mkdir -p /Library/Frameworks
          sudo cp -R "/tmp/syphon-sdk/Syphon SDK 5/Syphon.framework" /Library/Frameworks/
          ls /Library/Frameworks/Syphon.framework/Versions/A/ || true

      - name: Install native addon dependencies
        run: npm ci
        working-directory: electron/native

      # NDI Advanced SDK for Apple — same pattern as Windows. Fetched
      # from a private URL exposed via secrets.NDI_SDK_MAC_URL because
      # NewTek's distribution requires accepting the EULA before
      # download. Missing secret = NDI addon build is skipped silently.
      - name: Install NDI Advanced SDK (macOS)
        if: ${{ env.NDI_SDK_MAC_URL != '' }}
        env:
          NDI_SDK_MAC_URL: ${{ secrets.NDI_SDK_MAC_URL }}
        run: |
          echo "Downloading NDI SDK..."
          curl -L -o /tmp/ndi-sdk.pkg "$NDI_SDK_MAC_URL"
          echo "Installing..."
          sudo installer -pkg /tmp/ndi-sdk.pkg -target /
          # Sanity-check that the expected install layout landed where
          # CMake looks for it.
          SDK="/Library/NDI Advanced SDK for Apple"
          if [ ! -f "$SDK/include/Processing.NDI.Lib.h" ]; then
            SDK="/Library/NDI SDK for Apple"
          fi
          if [ -f "$SDK/include/Processing.NDI.Lib.h" ]; then
            echo "NDI SDK installed at $SDK"
            ls "$SDK/lib/macOS/"
          else
            echo "::warning::NDI SDK install did not produce expected files — ndi_addon will be skipped"
          fi

      - name: Build Syphon native addon
        run: npm run build
        working-directory: electron/native

      - name: Build frontend
        run: npm run build

      - name: Build Electron (macOS DMG - signed + notarized)
        # --publish never: see windows job comment.
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS DMGs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: riskcapital/ghost-arcade-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist-electron/*.dmg
            dist-electron/latest-mac.yml
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # libfuse2 is required for AppImage runtime (Ubuntu 22+ ships
      # libfuse3 by default; AppImages need the legacy lib). The other
      # apt deps are electron-builder Linux extras that are routinely
      # needed for icon / desktop-entry generation.
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            rpm \
            fakeroot \
            dpkg

      - name: Install dependencies
        run: npm ci

      - name: Install native addon dependencies
        run: npm ci
        working-directory: electron/native

      # NDI Advanced SDK for Linux — same pattern as Win / Mac jobs.
      # The .tar.gz installer lives behind NewTek's EULA; CI fetches
      # from the private storage URL exposed via secrets.NDI_SDK_LINUX_URL.
      # Missing secret = NDI addon build is skipped silently (CMake's
      # NDI block already handles the no-SDK case without erroring).
      - name: Install NDI Advanced SDK (Linux)
        if: ${{ env.NDI_SDK_LINUX_URL != '' }}
        env:
          NDI_SDK_LINUX_URL: ${{ secrets.NDI_SDK_LINUX_URL }}
        run: |
          echo "Downloading NDI SDK..."
          curl -L -o /tmp/ndi-sdk.tar.gz "$NDI_SDK_LINUX_URL"
          mkdir -p /tmp/ndi-sdk-extract
          tar -xzf /tmp/ndi-sdk.tar.gz -C /tmp/ndi-sdk-extract
          # Installer is a self-extracting shell script bundled with the
          # SDK contents. Run it non-interactively and direct it at /opt
          # so CMake's Linux NDI detection (which checks
          # /opt/NDI Advanced SDK for Linux) finds it.
          INSTALLER=$(find /tmp/ndi-sdk-extract -name "Install_NDI_SDK_*.sh" | head -1)
          if [ -n "$INSTALLER" ]; then
            yes | sh "$INSTALLER" --noexec --target /opt/ndi-tmp || true
            sudo cp -R /opt/ndi-tmp/* "/opt/" 2>/dev/null || true
          fi
          # Sanity-check
          if [ -f "/opt/NDI Advanced SDK for Linux/include/Processing.NDI.Lib.h" ]; then
            echo "NDI SDK installed at /opt/NDI Advanced SDK for Linux"
          elif [ -f "/opt/NDI SDK for Linux/include/Processing.NDI.Lib.h" ]; then
            echo "NDI SDK installed at /opt/NDI SDK for Linux"
          else
            echo "::warning::NDI SDK install did not produce expected files — ndi_addon will be skipped"
          fi

      # The main Spout/Syphon CMake branch silently no-ops on Linux
      # (it has no `else()` for the if(WIN32)/elseif(APPLE) chain), so
      # running `npm run build` here builds only the NDI addon when the
      # SDK is present. Safe to run regardless.
      - name: Build native addons (NDI only on Linux)
        run: npm run build || echo "Native addon build had no targets on Linux — continuing"
        working-directory: electron/native

      - name: Build frontend
        run: npm run build

      - name: Build Electron (Linux AppImage + deb)
        # --publish never: see windows job comment. No signing on Linux.
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: riskcapital/ghost-arcade-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest-linux.yml
          draft: false
          prerelease: false
          generate_release_notes: true
