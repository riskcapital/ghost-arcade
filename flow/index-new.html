<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Geometry — Endless (Custom Models)</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Dark blue-purple gradient background */
        #gradient-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                180deg,
                #0a0a1a 0%,
                #1a0a2e 25%,
                #0d1a2d 50%,
                #1a0a2e 75%,
                #0a0a1a 100%
            );
            z-index: 0;
        }

        #three-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #three-fg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00D9FF;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="gradient-bg"></div>
    <div id="three-bg"></div>
    <div id="three-fg"></div>
    <div id="loading">Loading models...</div>

    <script>
        // ============================================
        // PURE GEOMETRY — ENDLESS
        // Original soft lighting, cube clusters, no chrome
        // ============================================

        let sceneBg, cameraBg, rendererBg, geometriesBg = [];
        let sceneFg, cameraFg, rendererFg, geometriesFg = [];
        let loadedModels = [];
        let orbitingElectrons = [];
        let mouseLight, mouseLightFg;
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;
        
        // ============================================
        // CONFIGURATION
        // ============================================
        
        const MODEL_FILES = [
            'models/shark.glb',
            'models/sailboat.glb',
            'models/dog.glb',
            'models/sailboat.glb',
            'models/robot.glb',
            'models/cusi.glb',
            'models/sol.glb',
            'models/nyc.glb',
            'models/rodin.glb',
            'models/hand.glb',
        ];
        
        const COLORS = [0x00D9FF, 0x9D4EDD, 0xFF006E, 0xFF6B00, 0x00F5A0];
        
        // ============================================
        // CUBE CLUSTERS
        // ============================================
        
        function createCubeCluster(scene, isBackground) {
            const group = new THREE.Group();
            const numCubes = 5 + Math.floor(Math.random() * 15); // 5-20 cubes per cluster
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const baseSize = isBackground ? (2 + Math.random() * 4) : (0.1 + Math.random() * 0.3);
            
            // Cluster style
            const style = Math.random();
            const isWireframe = Math.random() < 0.6;
            
            for (let i = 0; i < numCubes; i++) {
                const size = baseSize * (0.3 + Math.random() * 1.2);
                const geometry = new THREE.BoxGeometry(size, size, size);
                
                const material = isWireframe 
                    ? new THREE.MeshPhongMaterial({
                        color: color,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.5 + Math.random() * 0.3,
                        emissive: color,
                        emissiveIntensity: 0.15
                    })
                    : new THREE.MeshPhongMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.25 + Math.random() * 0.25,
                        shininess: 100,
                        emissive: color,
                        emissiveIntensity: 0.1
                    });
                
                const cube = new THREE.Mesh(geometry, material);
                
                // Position cubes in cluster patterns
                if (style < 0.33) {
                    // Scattered cluster
                    cube.position.set(
                        (Math.random() - 0.5) * baseSize * 8,
                        (Math.random() - 0.5) * baseSize * 8,
                        (Math.random() - 0.5) * baseSize * 8
                    );
                } else if (style < 0.66) {
                    // Linear/diagonal arrangement
                    const t = i / numCubes;
                    cube.position.set(
                        t * baseSize * 12 - baseSize * 6,
                        t * baseSize * 8 - baseSize * 4 + (Math.random() - 0.5) * baseSize * 2,
                        (Math.random() - 0.5) * baseSize * 4
                    );
                } else {
                    // Spiral/helix
                    const angle = i * 0.5;
                    const radius = baseSize * 2 + i * baseSize * 0.3;
                    cube.position.set(
                        Math.cos(angle) * radius,
                        i * baseSize * 0.8 - numCubes * baseSize * 0.4,
                        Math.sin(angle) * radius
                    );
                }
                
                cube.rotation.set(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    Math.random() * Math.PI
                );
                
                group.add(cube);
            }
            
            // Position the cluster
            if (isBackground) {
                group.position.set(
                    (Math.random() - 0.5) * 160,
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 180
                );
            } else {
                group.position.set(
                    (Math.random() - 0.5) * 45,
                    (Math.random() - 0.5) * 56,
                    (Math.random() - 0.5) * 25
                );
            }
            
            group.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            
            group.userData = {
                speedY: isBackground ? (0.03 + Math.random() * 0.05) : (0.02 + Math.random() * 0.03),
                speedX: (Math.random() - 0.5) * 0.01,
                rotSpeedX: (Math.random() - 0.5) * 0.002,
                rotSpeedY: (Math.random() - 0.5) * 0.003,
                rotSpeedZ: (Math.random() - 0.5) * 0.001,
                isCluster: true
            };
            
            scene.add(group);
            return group;
        }
        
        // ============================================
        // ORBITING ELECTRONS
        // ============================================
        
        function addOrbitingElectrons(mesh) {
            const numOrbits = 1 + Math.floor(Math.random() * 2);
            const electrons = [];
            
            for (let o = 0; o < numOrbits; o++) {
                const orbitRadius = 6 + o * 3 + Math.random() * 2;
                const numElectrons = 1 + Math.floor(Math.random() * 2);
                const orbitTilt = new THREE.Euler(
                    Math.random() * Math.PI,
                    Math.random() * Math.PI,
                    0
                );
                const orbitSpeed = 0.8 + Math.random() * 1.2;
                const orbitColor = COLORS[Math.floor(Math.random() * COLORS.length)];
                
                // Orbit ring
                const ringGeo = new THREE.TorusGeometry(orbitRadius, 0.08, 8, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: orbitColor,
                    transparent: true,
                    opacity: 0.2
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.copy(orbitTilt);
                mesh.add(ring);
                
                for (let e = 0; e < numElectrons; e++) {
                    // Glowing electron sphere
                    const electronGeo = new THREE.SphereGeometry(0.5, 16, 16);
                    const electronMat = new THREE.MeshPhongMaterial({
                        color: orbitColor,
                        emissive: orbitColor,
                        emissiveIntensity: 0.8,
                        transparent: true,
                        opacity: 0.9
                    });
                    const electron = new THREE.Mesh(electronGeo, electronMat);
                    
                    mesh.add(electron);
                    
                    electrons.push({
                        mesh: electron,
                        radius: orbitRadius,
                        tilt: orbitTilt,
                        speed: orbitSpeed,
                        offset: (e / numElectrons) * Math.PI * 2
                    });
                }
            }
            
            return electrons;
        }
        
        function updateElectrons(time) {
            orbitingElectrons.forEach(e => {
                const angle = time * e.speed + e.offset;
                const x = Math.cos(angle) * e.radius;
                const y = Math.sin(angle) * e.radius;
                const pos = new THREE.Vector3(x, y, 0);
                pos.applyEuler(e.tilt);
                e.mesh.position.copy(pos);
            });
        }
        
        // ============================================
        // MATERIAL FACTORY - Original Style (No Chrome)
        // ============================================
        
        function createRandomMaterial() {
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const isWire = Math.random() < 0.55;
            
            if (isWire) {
                return new THREE.MeshPhongMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.6,
                    wireframe: true,
                    emissive: color,
                    emissiveIntensity: 0.15
                });
            } else {
                return new THREE.MeshPhongMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.35,
                    shininess: 100,
                    emissive: color,
                    emissiveIntensity: 0.1
                });
            }
        }
        
        // ============================================
        // MODEL LOADER
        // ============================================
        
        const loader = new THREE.GLTFLoader();
        
        async function loadModels() {
            const loadingEl = document.getElementById('loading');
            let loaded = 0;
            
            for (const path of MODEL_FILES) {
                try {
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(path, resolve, null, reject);
                    });
                    
                    gltf.scene.traverse((child) => {
                        if (child.isMesh && child.geometry) {
                            const geo = child.geometry.clone();
                            geo.computeBoundingSphere();
                            if (geo.boundingSphere.radius > 0) {
                                const scale = 1 / geo.boundingSphere.radius;
                                geo.scale(scale, scale, scale);
                                loadedModels.push(geo);
                            }
                        }
                    });
                    
                    loaded++;
                    loadingEl.textContent = `Loaded ${loaded}/${MODEL_FILES.length} models`;
                    
                } catch (e) {
                    console.warn(`Could not load ${path}:`, e);
                }
            }
            
            loadingEl.style.display = 'none';
            return loadedModels.length > 0;
        }
        
        // ============================================
        // GEOMETRY CREATION
        // ============================================
        
        function getRandomGeometry(baseSize) {
            const useLoadedModel = loadedModels.length > 0 && Math.random() < 0.6;
            
            if (useLoadedModel) {
                const geo = loadedModels[Math.floor(Math.random() * loadedModels.length)].clone();
                geo.scale(baseSize, baseSize, baseSize);
                return geo;
            }
            
            const type = Math.floor(Math.random() * 10);
            switch(type) {
                case 0: return new THREE.BoxGeometry(baseSize, baseSize, baseSize);
                case 1: return new THREE.BoxGeometry(baseSize * 2.5, baseSize * 0.15, baseSize * 2.5);
                case 2: return new THREE.BoxGeometry(baseSize * 0.15, baseSize * 3, baseSize * 0.15);
                case 3: return new THREE.TorusGeometry(baseSize * 0.7, baseSize * 0.15, 12, 24);
                case 4: return new THREE.OctahedronGeometry(baseSize * 0.8);
                case 5: return new THREE.TetrahedronGeometry(baseSize);
                case 6: return new THREE.IcosahedronGeometry(baseSize * 0.6);
                case 7: return new THREE.DodecahedronGeometry(baseSize * 0.5);
                case 8: return new THREE.TorusKnotGeometry(baseSize * 0.5, baseSize * 0.15, 64, 8);
                case 9: return new THREE.ConeGeometry(baseSize * 0.5, baseSize * 1.2, 8);
            }
        }

        function addBackgroundGeometry() {
            const size = (3 + Math.random() * 8) * 3;
            const geometry = getRandomGeometry(size);
            const material = createRandomMaterial();
            
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 160,
                (Math.random() - 0.5) * 200,
                (Math.random() - 0.5) * 180
            );
            
            mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, 0);
            mesh.userData = { 
                speedY: 0.05 + Math.random() * 0.08, 
                speedX: (Math.random() - 0.5) * 0.012, 
                rotSpeedX: (Math.random() - 0.5) * 0.0025, 
                rotSpeedY: (Math.random() - 0.5) * 0.004, 
                rotSpeedZ: (Math.random() - 0.5) * 0.0015 
            };
            
            // Add orbiting electrons to some larger objects
            if (Math.random() < 0.15 && size > 18) {
                const electrons = addOrbitingElectrons(mesh);
                orbitingElectrons.push(...electrons);
            }
            
            sceneBg.add(mesh);
            geometriesBg.push(mesh);
        }

        function addForegroundGeometry() {
            const size = 0.25 + Math.random() * 0.7;
            const geometry = getRandomGeometry(size);
            const material = createRandomMaterial();
            
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * 45,
                (Math.random() - 0.5) * 56,
                (Math.random() - 0.5) * 25
            );
            
            mesh.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, 0);
            mesh.userData = { 
                speedY: 0.025 + Math.random() * 0.04, 
                speedX: (Math.random() - 0.5) * 0.015, 
                rotSpeedX: (Math.random() - 0.5) * 0.008, 
                rotSpeedY: (Math.random() - 0.5) * 0.012, 
                rotSpeedZ: (Math.random() - 0.5) * 0.006, 
                oscillateX: Math.random() * Math.PI * 2, 
                oscillateSpeed: 0.4 + Math.random() * 0.8 
            };
            
            sceneFg.add(mesh);
            geometriesFg.push(mesh);
        }

        // ============================================
        // INIT & ANIMATE
        // ============================================

        async function init() {
            // Background scene
            sceneBg = new THREE.Scene();
            cameraBg = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            cameraBg.position.z = 80;
            rendererBg = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            rendererBg.setSize(window.innerWidth, window.innerHeight);
            rendererBg.setClearColor(0x000000, 0);
            document.getElementById('three-bg').appendChild(rendererBg.domElement);

            // Foreground scene
            sceneFg = new THREE.Scene();
            cameraFg = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            cameraFg.position.z = 30;
            rendererFg = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            rendererFg.setSize(window.innerWidth, window.innerHeight);
            rendererFg.setClearColor(0x000000, 0);
            document.getElementById('three-fg').appendChild(rendererFg.domElement);

            // FOG - soft atmospheric haze
            sceneBg.fog = new THREE.FogExp2(0x1a0a2e, 0.003);
            sceneFg.fog = new THREE.FogExp2(0x1a0a2e, 0.012);

            // Original lighting setup - exactly as v10
            sceneBg.add(new THREE.AmbientLight(0x404040, 0.3));
            const l1 = new THREE.PointLight(0x00D9FF, 0.8, 200); l1.position.set(40, 40, 40); sceneBg.add(l1);
            const l2 = new THREE.PointLight(0xFF006E, 0.8, 200); l2.position.set(-40, -40, 40); sceneBg.add(l2);
            const l3 = new THREE.PointLight(0x9D4EDD, 0.6, 200); l3.position.set(0, 40, -40); sceneBg.add(l3);
            
            sceneFg.add(new THREE.AmbientLight(0x404040, 0.4));
            const lf = new THREE.PointLight(0x9D4EDD, 1, 100); lf.position.set(0, 0, 20); sceneFg.add(lf);

            // Mouse-following lights
            mouseLight = new THREE.PointLight(0xFFFFFF, 1.2, 300);
            mouseLight.position.set(0, 0, 60);
            sceneBg.add(mouseLight);
            
            mouseLightFg = new THREE.PointLight(0xFFFFFF, 0.8, 80);
            mouseLightFg.position.set(0, 0, 25);
            sceneFg.add(mouseLightFg);

            // Mouse tracking
            document.addEventListener('mousemove', (e) => {
                // Normalize mouse position to -1 to 1
                targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            // Touch support
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    targetMouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    targetMouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            });

            // Load models
            await loadModels();

            // Add cube clusters (background)
            for (let i = 0; i < 15; i++) {
                const cluster = createCubeCluster(sceneBg, true);
                geometriesBg.push(cluster);
            }
            
            // Add cube clusters (foreground)
            for (let i = 0; i < 8; i++) {
                const cluster = createCubeCluster(sceneFg, false);
                geometriesFg.push(cluster);
            }

            // Seed individual geometry
            for (let i = 0; i < 100; i++) {
                addBackgroundGeometry();
            }
            for (let i = 0; i < 40; i++) {
                addForegroundGeometry();
            }

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Smooth mouse following
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            
            // Update mouse-following lights
            mouseLight.position.x = mouseX * 80;
            mouseLight.position.y = mouseY * 60;
            mouseLight.position.z = 60;
            
            mouseLightFg.position.x = mouseX * 25;
            mouseLightFg.position.y = mouseY * 20;
            mouseLightFg.position.z = 25;
            
            // Update orbiting electrons
            updateElectrons(time);
            
            // Update background geometry
            geometriesBg.forEach(g => { 
                g.position.y += g.userData.speedY; 
                g.position.x += g.userData.speedX || 0; 
                g.rotation.x += g.userData.rotSpeedX; 
                g.rotation.y += g.userData.rotSpeedY; 
                g.rotation.z += g.userData.rotSpeedZ; 
                
                if (g.position.y > 110) { 
                    g.position.y = -90; 
                    g.position.x = (Math.random() - 0.5) * 160; 
                } 
            });
            
            // Update foreground geometry
            geometriesFg.forEach(g => { 
                g.position.y += g.userData.speedY; 
                if (g.userData.oscillateSpeed) {
                    g.position.x += Math.sin(time * g.userData.oscillateSpeed + g.userData.oscillateX) * 0.015; 
                } else {
                    g.position.x += g.userData.speedX || 0;
                }
                g.rotation.x += g.userData.rotSpeedX; 
                g.rotation.y += g.userData.rotSpeedY; 
                g.rotation.z += g.userData.rotSpeedZ; 
                
                if (g.position.y > 28) { 
                    g.position.y = -28; 
                    g.position.x = (Math.random() - 0.5) * 45; 
                } 
            });
            
            // Camera movement - exactly as v10
            const ct = time * 0.05;
            cameraBg.position.set(Math.sin(ct * 0.5) * 6, Math.cos(ct * 0.3) * 4, 80 + Math.sin(ct * 0.2) * 8); 
            cameraBg.lookAt(0, 0, 0);
            cameraFg.position.set(Math.sin(ct * 0.6) * 2, Math.cos(ct * 0.35) * 1.5, 30); 
            cameraFg.lookAt(0, 0, 0);
            
            rendererBg.render(sceneBg, cameraBg);
            rendererFg.render(sceneFg, cameraFg);
        }

        window.addEventListener('resize', () => {
            cameraBg.aspect = window.innerWidth / window.innerHeight;
            cameraBg.updateProjectionMatrix();
            rendererBg.setSize(window.innerWidth, window.innerHeight);
            
            cameraFg.aspect = window.innerWidth / window.innerHeight;
            cameraFg.updateProjectionMatrix();
            rendererFg.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
