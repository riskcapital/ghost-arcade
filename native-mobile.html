<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <title>Ghost Arcade Mobile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        transition: opacity 0.5s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 180px;
        height: auto;
        margin-bottom: 32px;
        animation: splash-float 2.5s ease-in-out infinite;
      }
      #splash .splash-text {
        font-size: 13px;
        color: #666;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      #splash .splash-bar-track {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      #splash .splash-bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, #bb86fc, #69f0ae);
        border-radius: 2px;
        animation: splash-slide 1.2s ease-in-out infinite;
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="./logo.png" alt="Ghost Arcade" />
      <div class="splash-text">Loading</div>
      <div class="splash-bar-track">
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/native-mobile-main.ts"></script>
  </body>
</html>
