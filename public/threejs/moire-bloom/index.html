<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Moire Bloom · Ghost Arcade p5.js shader</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Moire Bloom: Op-art interference rings from drifting sources, split into chromatic fringes. The beat kicks the rings outward.
    // One fullscreen fragment shader driven by p5.js (WEBGL). Sliders come
    // from window.shaderParams; audio from window.ghostAudio. Ghost Arcade Pro
    // runs the shader natively: its uniforms share the sliders' names, and
    // the audio uniforms use Ghost Arcade's audio names.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      density: 1.0, // min: 0.2 max: 3
      chroma: 0.6, // min: 0 max: 2
      sharp: 0.6, // min: 0 max: 1
      hue: 0.0, // min: 0 max: 1
      react: 0.6, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'density', label: 'Ring Density', type: 'number', min: 0.2, max: 3, default: 1.0 },
      { name: 'chroma', label: 'Chromatic Split', type: 'number', min: 0, max: 2, default: 0.6 },
      { name: 'sharp', label: 'Line Sharpness', type: 'number', min: 0, max: 1, default: 0.6 },
      { name: 'hue', label: 'Hue Shift', type: 'number', min: 0, max: 1, default: 0.0 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.6 },
    ];

    const vert = `
attribute vec3 aPosition;
void main() {
  vec4 position = vec4(aPosition, 1.0);
  position.xy = position.xy * 2.0 - 1.0;
  gl_Position = position;
}`;

    const frag = `
precision highp float;
uniform vec2 resolution;
uniform float time;
uniform float density;
uniform float chroma;
uniform float sharp;
uniform float hue;
uniform float react;
uniform float audioLevel;
uniform float audioBass;
uniform float audioMid;
uniform float audioHigh;
uniform float audioBeat;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.17));
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}
vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2831853 * (t + vec3(0.0, 0.33, 0.67)));
}
vec3 hueRotate(vec3 c, float h) {
  vec3 k = vec3(0.57735);
  float a = h * 6.2831853;
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}
vec3 tonemap(vec3 c) {
  c = max(c, 0.0);
  return c / (1.0 + c * 0.6);
}

float field(vec2 uv, float offset, float pulse) {
  float v = 0.0;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    vec2 c = 0.62 * vec2(sin(time * 0.31 + fi * 1.7), cos(time * 0.23 + fi * 2.3));
    float d = length(uv - c);
    v += sin(d * density * 34.0 - time * 2.2 - pulse + offset);
  }
  return v * 0.25;
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
  float pulse = react * (4.0 * audioBeat + 2.0 * audioBass);
  float split = 0.35 * chroma;
  vec3 v = vec3(field(uv, 0.0, pulse), field(uv, split, pulse), field(uv, 2.0 * split, pulse));
  // Thin glowing contour lines where each channel crosses zero.
  float k = mix(4.0, 40.0, sharp);
  vec3 lines = exp(-abs(v) * k);
  vec3 tint = palette(hue + 0.6 + 0.15 * sin(time * 0.2 + length(uv) * 2.0));
  vec3 col = lines * mix(vec3(1.0), tint * 1.6, 0.55);
  col += 0.12 * tint * (0.5 + 0.5 * v.g);
  col *= 1.0 + react * 0.6 * audioLevel;
  col *= smoothstep(1.5, 0.3, length(uv));
  gl_FragColor = vec4(tonemap(col * 1.4), 1.0);
}
`;

    let ghostShader;
    let shaderTime = 0;

    function num(value, fallback) {
      return typeof value === 'number' && isFinite(value) ? value : fallback;
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      ghostShader = createShader(vert, frag);
    }

    function draw() {
      const p = window.shaderParams || {};
      const a = window.ghostAudio || {};
      // Speed scales the clock rather than the shader, so changing it never jumps.
      shaderTime += Math.min(deltaTime, 100) / 1000 * num(p.speed, 1.0);
      shader(ghostShader);
      ghostShader.setUniform('resolution', [width, height]);
      ghostShader.setUniform('time', shaderTime);
      ghostShader.setUniform('density', num(p.density, 1.0));
      ghostShader.setUniform('chroma', num(p.chroma, 0.6));
      ghostShader.setUniform('sharp', num(p.sharp, 0.6));
      ghostShader.setUniform('hue', num(p.hue, 0.0));
      ghostShader.setUniform('react', num(p.react, 0.6));
      ghostShader.setUniform('audioLevel', num(a.level, 0));
      ghostShader.setUniform('audioBass', num(a.bass, 0));
      ghostShader.setUniform('audioMid', num(a.mid, 0));
      ghostShader.setUniform('audioHigh', num(a.high !== undefined ? a.high : a.treble, 0));
      ghostShader.setUniform('audioBeat', num(a.beat, 0));
      rect(0, 0, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
