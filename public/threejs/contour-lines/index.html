<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lets Ghost Arcade keep this page's alpha (see the Transparent switch). -->
  <meta name="ghost-arcade-background" content="transparent">
  <title>Contour Lines · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Contour Lines: Plotter-style contour lines traced from a drifting noise field with marching squares. One colour, projected large; the snare shifts the levels.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, or turn on Transparent to draw over the layers below. Put
    // glow, feedback or colour effects after it in the layer's chain.
    window.shaderParams = {
      transparent: false,
      speed: 1.0, // min: 0 max: 3
      levels: 12.0, // min: 3 max: 30
      cell: 16.0, // min: 6 max: 40
      scale: 1.0, // min: 0.3 max: 3
      hue: 0.12, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'transparent', label: 'Transparent', type: 'boolean', default: false },
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'levels', label: 'Levels', type: 'number', min: 3, max: 30, default: 12.0 },
      { name: 'cell', label: 'Detail', type: 'number', min: 6, max: 40, default: 16.0 },
      { name: 'scale', label: 'Field Scale', type: 'number', min: 0.3, max: 3, default: 1.0 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.12 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function S(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'string' ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Clear or fade the frame. With the Transparent switch on, the canvas
    // fades to see-through instead of black, so the marks can sit over the
    // layers below (Ghost Arcade keeps the alpha for this page).
    function fadeTo(alpha) {
      const ctx = drawingContext;
      const clear = (window.shaderParams || {}).transparent === true;
      ctx.globalCompositeOperation = clear ? 'destination-out' : 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, alpha)) + ')';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'source-over';
    }

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let field = null, cols = 0, rows = 0, cellPx = 0, shift = 0, shiftTarget = 0, contourTime = 0;

    function setup() { pixelDensity(1); createCanvas(windowWidth, windowHeight); noiseDetail(3, 0.5); }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const react = P('react', 0.8);
      cellPx = Math.max(6, Math.floor(P('cell', 14)));
      const c = Math.ceil(width / cellPx) + 1, r = Math.ceil(height / cellPx) + 1;
      if (c !== cols || r !== rows) { cols = c; rows = r; field = new Float32Array(cols * rows); }
      if (ev.snare) shiftTarget += 0.5;
      shift += (shiftTarget - shift) * Math.min(1, dt * 4);
      const k = 0.0016 * P('scale', 1) * cellPx;
      contourTime += dt * 0.15 * P('speed', 1) * (1 + react * 2 * (a.level || 0));
      const t = contourTime;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        field[j * cols + i] = noise(i * k, j * k, t);
      }
      const L = Math.floor(constrain(P('levels', 12), 3, 30));
      const ctx = drawingContext;
      fadeTo(1);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const h = P('hue', 0.12) * 360;
      for (let l = 0; l < L; l++) {
        const iso = 0.15 + 0.7 * (((l + shift) / L) % 1);
        const path = new Path2D();
        const s = cellPx;
        for (let j = 0; j < rows - 1; j++) {
          const y = j * s;
          for (let i = 0; i < cols - 1; i++) {
            const v0 = field[j * cols + i], v1 = field[j * cols + i + 1], v2 = field[(j + 1) * cols + i + 1], v3 = field[(j + 1) * cols + i];
            const idx = (v0 > iso ? 8 : 0) | (v1 > iso ? 4 : 0) | (v2 > iso ? 2 : 0) | (v3 > iso ? 1 : 0);
            if (idx === 0 || idx === 15) continue;
            const x = i * s;
            // Edge crossings, computed only where used: top, right, bottom, left.
            const tX = x + s * (iso - v0) / (v1 - v0);
            const rY = y + s * (iso - v1) / (v2 - v1);
            const bX = x + s * (iso - v3) / (v2 - v3);
            const lY = y + s * (iso - v0) / (v3 - v0);
            switch (idx) {
              case 1: case 14: path.moveTo(x, lY); path.lineTo(bX, y + s); break;
              case 2: case 13: path.moveTo(bX, y + s); path.lineTo(x + s, rY); break;
              case 3: case 12: path.moveTo(x, lY); path.lineTo(x + s, rY); break;
              case 4: case 11: path.moveTo(tX, y); path.lineTo(x + s, rY); break;
              case 6: case 9: path.moveTo(tX, y); path.lineTo(bX, y + s); break;
              case 7: case 8: path.moveTo(x, lY); path.lineTo(tX, y); break;
              case 5: path.moveTo(x, lY); path.lineTo(tX, y); path.moveTo(bX, y + s); path.lineTo(x + s, rY); break;
              case 10: path.moveTo(tX, y); path.lineTo(x + s, rY); path.moveTo(x, lY); path.lineTo(bX, y + s); break;
            }
          }
        }
        const major = l % 4 === 0;
        ctx.lineWidth = major ? 3 : 1.6;
        ctx.strokeStyle = 'hsla(' + h + ',' + (major ? 90 : 75) + '%,' + (major ? 75 : 62) + '%,' + (major ? 1 : 0.8) + ')';
        ctx.stroke(path);
      }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
</html>
