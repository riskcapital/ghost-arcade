<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lets Ghost Arcade keep this page's alpha (see the Transparent switch). -->
  <meta name="ghost-arcade-background" content="transparent">
  <title>Growing Tree · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Growing Tree: A recursive tree grows one generation per bar, its strokes tapering by depth and swaying in a noise wind. Blossoms flash on the beat; when it is full it fades and a new tree grows.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, or turn on Transparent to draw over the layers below. Put
    // glow, feedback or colour effects after it in the layer's chain.
    window.shaderParams = {
      transparent: false,
      speed: 1.0, // min: 0 max: 3
      depth: 10.0, // min: 5 max: 12
      spread: 0.45, // min: 0.1 max: 1.2
      wind: 0.5, // min: 0 max: 2
      hue: 0.08, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'transparent', label: 'Transparent', type: 'boolean', default: false },
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'depth', label: 'Max Depth', type: 'number', min: 5, max: 12, default: 10.0 },
      { name: 'spread', label: 'Branch Angle', type: 'number', min: 0.1, max: 1.2, default: 0.45 },
      { name: 'wind', label: 'Wind', type: 'number', min: 0, max: 2, default: 0.5 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.08 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function S(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'string' ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Clear or fade the frame. With the Transparent switch on, the canvas
    // fades to see-through instead of black, so the marks can sit over the
    // layers below (Ghost Arcade keeps the alpha for this page).
    function fadeTo(alpha) {
      const ctx = drawingContext;
      const clear = (window.shaderParams || {}).transparent === true;
      ctx.globalCompositeOperation = clear ? 'destination-out' : 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, alpha)) + ')';
      ctx.fillRect(0, 0, width, height);
      if (!clear) {
        // Keep the frame fully opaque: back anything see-through with black.
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let generation = 0, growth = 0, bloom = 0, fadeOut = 0, treeSeed = 1, barHits = 0;
    let segPaths, tipPath;

    function branch(x, y, len, ang, d, maxD, t, wind) {
      const g = d < generation ? 1 : d === generation ? growth : 0;
      if (g <= 0) return;
      const sway = (noise(d * 0.7, treeSeed, t) - 0.5) * wind * (0.2 + d * 0.06);
      const a = ang + sway;
      const x2 = x + Math.cos(a) * len * g;
      const y2 = y + Math.sin(a) * len * g;
      segPaths[Math.min(d, segPaths.length - 1)].moveTo(x, y);
      segPaths[Math.min(d, segPaths.length - 1)].lineTo(x2, y2);
      if (d === maxD || (d === generation && g >= 1)) { tipPath.moveTo(x2 + 3, y2); tipPath.arc(x2, y2, 3, 0, Math.PI * 2); }
      if (d >= maxD || g < 1) return;
      randomSeed(treeSeed * 1000 + d * 97 + Math.floor(x * 7 + y * 13));
      const spread = P('spread', 0.45);
      const l1 = len * random(0.66, 0.8), l2 = len * random(0.62, 0.78);
      const a1 = a - spread * random(0.6, 1.3), a2 = a + spread * random(0.6, 1.3);
      branch(x2, y2, l1, a1, d + 1, maxD, t, wind);
      branch(x2, y2, l2, a2, d + 1, maxD, t, wind);
      if (d < 3 && random() < 0.35) branch(x2, y2, len * 0.6, a + random(-0.2, 0.2), d + 1, maxD, t, wind);
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight);
      background(0);
    }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const speed = P('speed', 1);
      const react = P('react', 0.8);
      const maxD = Math.floor(constrain(P('depth', 10), 5, 12));
      if (ev.hit) { barHits++; bloom = 1; }
      if (barHits >= 4 && generation < maxD && fadeOut === 0) { barHits = 0; if (growth >= 1) { generation++; growth = 0; } }
      growth = Math.min(1, growth + dt * 1.6 * speed);
      bloom = Math.max(0, bloom - dt * 3);
      if (generation >= maxD && growth >= 1 && barHits >= 8 && fadeOut === 0) fadeOut = 0.0001;
      if (fadeOut > 0) {
        fadeOut += dt * 0.5 * speed;
        if (fadeOut >= 1) { fadeOut = 0; generation = 0; growth = 0; barHits = 0; treeSeed++; }
      }

      segPaths = []; for (let d = 0; d <= 12; d++) segPaths.push(new Path2D());
      tipPath = new Path2D();
      const len = height * 0.24;
      branch(width / 2, height * 0.98, len, -Math.PI / 2, 0, maxD, frameCount * 0.004 * speed, P('wind', 0.5) * (1 + react * (a.bass || 0)));

      const ctx = drawingContext;
      fadeTo(1);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const alpha = 1 - fadeOut;
      const base = P('hue', 0.08) * 360;
      for (let d = 0; d <= maxD; d++) {
        const w = Math.max(0.6, (height / 70) * Math.pow(0.72, d));
        const h = (base + d * 16) % 360;
        ctx.lineWidth = w * 2.6;
        ctx.strokeStyle = 'hsla(' + h + ',80%,45%,' + 0.12 * alpha + ')';
        ctx.stroke(segPaths[d]);
        ctx.lineWidth = w;
        ctx.strokeStyle = 'hsla(' + h + ',75%,' + (55 + d * 2) + '%,' + 0.85 * alpha + ')';
        ctx.stroke(segPaths[d]);
      }
      ctx.fillStyle = 'hsla(' + ((base + 200) % 360) + ',90%,75%,' + (0.25 + 0.75 * bloom * react) * alpha + ')';
      ctx.fill(tipPath);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
</html>
