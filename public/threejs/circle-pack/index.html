<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lets Ghost Arcade keep this page's alpha (see the Transparent switch). -->
  <meta name="ghost-arcade-background" content="transparent">
  <title>Circle Pack · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Circle Pack: Circles grow until they touch, packing the frame over the course of a song. When it is full, or when the music drops, the pack dissolves and starts again.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, or turn on Transparent to draw over the layers below. Put
    // glow, feedback or colour effects after it in the layer's chain.
    window.shaderParams = {
      transparent: false,
      speed: 1.0, // min: 0 max: 3
      spawn: 3.0, // min: 1 max: 40
      gap: 2.0, // min: 0 max: 12
      fill: 0.15, // min: 0 max: 1
      hue: 0.75, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'transparent', label: 'Transparent', type: 'boolean', default: false },
      { name: 'speed', label: 'Growth Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'spawn', label: 'Spawn Rate', type: 'number', min: 1, max: 40, default: 3.0 },
      { name: 'gap', label: 'Gap', type: 'number', min: 0, max: 12, default: 2.0 },
      { name: 'fill', label: 'Fill', type: 'number', min: 0, max: 1, default: 0.15 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.75 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function S(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'string' ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Clear or fade the frame. With the Transparent switch on, the canvas
    // fades to see-through instead of black, so the marks can sit over the
    // layers below (Ghost Arcade keeps the alpha for this page).
    function fadeTo(alpha) {
      const ctx = drawingContext;
      const clear = (window.shaderParams || {}).transparent === true;
      ctx.globalCompositeOperation = clear ? 'destination-out' : 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, alpha)) + ')';
      ctx.fillRect(0, 0, width, height);
      if (!clear) {
        // Keep the frame fully opaque: back anything see-through with black.
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let circles = [], growing = [], dissolve = 0, failures = 0, energySlow = 0, energyFast = 0;
    // Finished circles are indexed by grid cell, so a check only looks at
    // its neighbourhood instead of every circle on screen.
    const G = 32;
    let grid = new Map(), stamp = 0;

    function register(c) {
      const pad = P('gap', 2);
      const i0 = Math.floor((c.x - c.r - pad) / G), i1 = Math.floor((c.x + c.r + pad) / G);
      const j0 = Math.floor((c.y - c.r - pad) / G), j1 = Math.floor((c.y + c.r + pad) / G);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const k = i * 100000 + j;
        let cell = grid.get(k); if (!cell) { cell = []; grid.set(k, cell); } cell.push(c);
      }
    }

    function hitsAny(x, y, r, self) {
      const gap = P('gap', 2);
      for (const o of growing) {
        if (o === self) continue;
        const dx = o.x - x, dy = o.y - y, rr = o.r + r + gap;
        if (dx * dx + dy * dy < rr * rr) return true;
      }
      stamp++;
      const i0 = Math.floor((x - r - gap) / G), i1 = Math.floor((x + r + gap) / G);
      const j0 = Math.floor((y - r - gap) / G), j1 = Math.floor((y + r + gap) / G);
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const cell = grid.get(i * 100000 + j); if (!cell) continue;
        for (const o of cell) {
          if (o.seen === stamp) continue;
          o.seen = stamp;
          const dx = o.x - x, dy = o.y - y, rr = o.r + r + gap;
          if (dx * dx + dy * dy < rr * rr) return true;
        }
      }
      return false;
    }

    function fits(x, y, r) {
      if (x - r < 0 || x + r > width || y - r < 0 || y + r > height) return false;
      return !hitsAny(x, y, r, null);
    }

    function resetPack() { circles = []; growing = []; grid = new Map(); failures = 0; }

    function setup() { pixelDensity(1); createCanvas(windowWidth, windowHeight); }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const react = P('react', 0.8);
      energyFast += ((a.level || 0) - energyFast) * Math.min(1, dt * 8);
      energySlow += ((a.level || 0) - energySlow) * Math.min(1, dt * 0.4);
      const drop = react > 0 && energyFast > energySlow + 0.25 && energyFast > 0.45;

      if (dissolve > 0) {
        dissolve += dt * 0.8;
        if (dissolve >= 1) { resetPack(); dissolve = 0; }
      } else {
        if (drop && circles.length > 40) dissolve = 0.0001;
        const tries = Math.floor(P('spawn', 12));
        let placed = 0;
        for (let t = 0; t < tries * 3 && placed < tries; t++) {
          const x = random(width), y = random(height);
          if (fits(x, y, 1)) { const c = { x, y, r: 1, hue: random(), seen: 0 }; circles.push(c); growing.push(c); placed++; }
        }
        failures = placed === 0 ? failures + 1 : 0;
        if (failures > 90) dissolve = 0.0001;
        const g = (1.4 + react * 2.5 * (a.bass || 0)) * P('speed', 1) * 60 * dt;
        const still = [];
        for (const c of growing) {
          c.r += g;
          const edge = c.x - c.r < 0 || c.x + c.r > width || c.y - c.r < 0 || c.y + c.r > height;
          if (edge || hitsAny(c.x, c.y, c.r, c)) { c.r = Math.max(1, c.r - g); register(c); }
          else still.push(c);
        }
        growing = still;
      }
      if (ev.hit && circles.length) { for (let k = 0; k < 6; k++) { const c = circles[Math.floor(random(circles.length))]; c.flash = 1; } }

      const ctx = drawingContext;
      fadeTo(1);
      const shrink = 1 - dissolve;
      const base = P('hue', 0.75);
      const BUCKETS = 6;
      const strokes = [], fills = [], flashes = new Path2D();
      for (let b = 0; b < BUCKETS; b++) { strokes.push(new Path2D()); fills.push(new Path2D()); }
      for (const c of circles) {
        const r = c.r * shrink;
        if (r < 0.5) continue;
        const b = Math.min(BUCKETS - 1, Math.floor(Math.min(1, c.r / (Math.min(width, height) * 0.15)) * BUCKETS));
        strokes[b].moveTo(c.x + r, c.y); strokes[b].arc(c.x, c.y, r, 0, TWO_PI);
        fills[b].moveTo(c.x + r, c.y); fills[b].arc(c.x, c.y, r, 0, TWO_PI);
        if (c.flash > 0) { flashes.moveTo(c.x + r, c.y); flashes.arc(c.x, c.y, r, 0, TWO_PI); c.flash -= dt * 3; }
      }
      ctx.lineWidth = 1.6;
      for (let b = 0; b < BUCKETS; b++) {
        const h = ((base + b * 0.11) % 1) * 360;
        ctx.fillStyle = 'hsla(' + h + ',80%,45%,' + P('fill', 0.15) + ')';
        ctx.fill(fills[b]);
        ctx.strokeStyle = 'hsl(' + h + ',90%,' + (60 + b * 4) + '%)';
        ctx.stroke(strokes[b]);
      }
      ctx.fillStyle = 'hsla(' + (base * 360 + 180) % 360 + ',90%,75%,0.6)';
      ctx.fill(flashes);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); resetPack(); }
  </script>
</body>
</html>
