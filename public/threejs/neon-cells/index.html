<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Neon Cells · Ghost Arcade p5.js shader</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Neon Cells: Living Voronoi cells with glowing neon membranes. Cells breathe with the beat and drift in two layers of depth.
    // One fullscreen fragment shader driven by p5.js (WEBGL). Sliders come
    // from window.shaderParams; audio from window.ghostAudio. Ghost Arcade Pro
    // runs the shader natively: its uniforms share the sliders' names, and
    // the audio uniforms use Ghost Arcade's audio names.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      scale: 1.0, // min: 0.3 max: 3
      edge: 1.0, // min: 0 max: 3
      fill: 0.35, // min: 0 max: 1
      hue: 0.0, // min: 0 max: 1
      react: 0.6, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'scale', label: 'Cell Size', type: 'number', min: 0.3, max: 3, default: 1.0 },
      { name: 'edge', label: 'Edge Glow', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'fill', label: 'Cell Fill', type: 'number', min: 0, max: 1, default: 0.35 },
      { name: 'hue', label: 'Hue Shift', type: 'number', min: 0, max: 1, default: 0.0 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.6 },
    ];

    const vert = `
attribute vec3 aPosition;
void main() {
  vec4 position = vec4(aPosition, 1.0);
  position.xy = position.xy * 2.0 - 1.0;
  gl_Position = position;
}`;

    const frag = `
precision highp float;
uniform vec2 resolution;
uniform float time;
uniform float scale;
uniform float edge;
uniform float fill;
uniform float hue;
uniform float react;
uniform float audioLevel;
uniform float audioBass;
uniform float audioMid;
uniform float audioHigh;
uniform float audioBeat;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.17));
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}
vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2831853 * (t + vec3(0.0, 0.33, 0.67)));
}
vec3 hueRotate(vec3 c, float h) {
  vec3 k = vec3(0.57735);
  float a = h * 6.2831853;
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}
vec3 tonemap(vec3 c) {
  c = max(c, 0.0);
  return c / (1.0 + c * 0.6);
}

vec3 cells(vec2 p, float t) {
  vec2 g = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  float id = 0.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 o = vec2(float(x), float(y));
      vec2 h = hash22(g + o);
      vec2 c = o + 0.5 + 0.42 * sin(t + 6.2831853 * h);
      float d = length(c - f);
      if (d < d1) { d2 = d1; d1 = d; id = hash21(g + o); }
      else if (d < d2) { d2 = d; }
    }
  }
  return vec3(d1, d2 - d1, id);
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
  float t = time * 0.5;
  float breathe = 1.0 + react * 0.25 * audioBeat;
  vec3 col = vec3(0.0);
  // Back layer: small, dim cells drifting the other way.
  vec3 b = cells(uv * 9.0 / scale + vec2(-t * 0.3, t * 0.1), t * 0.7);
  col += palette(b.z + hue + 0.5) * exp(-b.y * 40.0) * 0.25 * edge;
  // Front layer.
  vec3 c = cells(uv * 4.0 / scale * breathe + vec2(t * 0.2, 0.0), t);
  vec3 tint = palette(c.z * 0.8 + hue + time * 0.02);
  float membrane = exp(-c.y * 22.0) * edge;
  float core = smoothstep(0.5, 0.0, c.x) * fill;
  col += tint * (membrane * 1.6 + core * (0.4 + react * 0.8 * audioBass));
  col += vec3(1.0) * exp(-c.y * 90.0) * 0.6 * edge;
  col *= smoothstep(1.5, 0.3, length(uv));
  gl_FragColor = vec4(tonemap(col * 1.2), 1.0);
}
`;

    let ghostShader;
    let shaderTime = 0;

    function num(value, fallback) {
      return typeof value === 'number' && isFinite(value) ? value : fallback;
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      ghostShader = createShader(vert, frag);
    }

    function draw() {
      const p = window.shaderParams || {};
      const a = window.ghostAudio || {};
      // Speed scales the clock rather than the shader, so changing it never jumps.
      shaderTime += Math.min(deltaTime, 100) / 1000 * num(p.speed, 1.0);
      shader(ghostShader);
      ghostShader.setUniform('resolution', [width, height]);
      ghostShader.setUniform('time', shaderTime);
      ghostShader.setUniform('scale', num(p.scale, 1.0));
      ghostShader.setUniform('edge', num(p.edge, 1.0));
      ghostShader.setUniform('fill', num(p.fill, 0.35));
      ghostShader.setUniform('hue', num(p.hue, 0.0));
      ghostShader.setUniform('react', num(p.react, 0.6));
      ghostShader.setUniform('audioLevel', num(a.level, 0));
      ghostShader.setUniform('audioBass', num(a.bass, 0));
      ghostShader.setUniform('audioMid', num(a.mid, 0));
      ghostShader.setUniform('audioHigh', num(a.high !== undefined ? a.high : a.treble, 0));
      ghostShader.setUniform('audioBeat', num(a.beat, 0));
      rect(0, 0, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
