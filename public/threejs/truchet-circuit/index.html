<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Truchet Circuit · Ghost Arcade p5.js shader</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Truchet Circuit: An endless neon maze of Truchet arcs with pulses of light racing along the paths. Pulses speed up with the music.
    // One fullscreen fragment shader driven by p5.js (WEBGL). Sliders come
    // from window.shaderParams; audio from window.ghostAudio. Ghost Arcade Pro
    // runs the shader natively: its uniforms share the sliders' names, and
    // the audio uniforms use Ghost Arcade's audio names.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      scale: 1.0, // min: 0.3 max: 3
      flow: 1.0, // min: 0 max: 3
      glow: 1.0, // min: 0 max: 3
      hue: 0.0, // min: 0 max: 1
      react: 0.6, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'scale', label: 'Tile Size', type: 'number', min: 0.3, max: 3, default: 1.0 },
      { name: 'flow', label: 'Pulse Flow', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'glow', label: 'Glow', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'hue', label: 'Hue Shift', type: 'number', min: 0, max: 1, default: 0.0 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.6 },
    ];

    const vert = `
attribute vec3 aPosition;
void main() {
  vec4 position = vec4(aPosition, 1.0);
  position.xy = position.xy * 2.0 - 1.0;
  gl_Position = position;
}`;

    const frag = `
precision highp float;
uniform vec2 resolution;
uniform float time;
uniform float scale;
uniform float flow;
uniform float glow;
uniform float hue;
uniform float react;
uniform float audioLevel;
uniform float audioBass;
uniform float audioMid;
uniform float audioHigh;
uniform float audioBeat;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.17));
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}
vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2831853 * (t + vec3(0.0, 0.33, 0.67)));
}
vec3 hueRotate(vec3 c, float h) {
  vec3 k = vec3(0.57735);
  float a = h * 6.2831853;
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}
vec3 tonemap(vec3 c) {
  c = max(c, 0.0);
  return c / (1.0 + c * 0.6);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
  float t = time;
  vec2 p = uv * 7.0 / scale + vec2(t * 0.15, t * 0.08);
  vec2 g = floor(p);
  vec2 f = fract(p) - 0.5;
  float tileRand = fract(sin(dot(g, vec2(127.1, 311.7))) * 43758.5453);
  float flip = step(0.5, tileRand);
  if (flip > 0.5) f.x = -f.x;
  // Two quarter-circle arcs around opposite corners.
  vec2 c1 = f - vec2(0.5, 0.5);
  vec2 c2 = f + vec2(0.5, 0.5);
  float d1 = abs(length(c1) - 0.5);
  float d2 = abs(length(c2) - 0.5);
  float d = min(d1, d2);
  vec2 c = d1 < d2 ? c1 : c2;
  float ang = atan(c.y, c.x);
  // Pulses travel along each arc; direction alternates per tile for flow.
  float dir = mod(g.x + g.y, 2.0) * 2.0 - 1.0;
  float rate = flow * (1.0 + react * 1.5 * audioLevel);
  float pulse = pow(0.5 + 0.5 * sin(ang * 4.0 * dir + t * 4.0 * rate + hash21(g) * 6.2831853), 12.0);
  float line = exp(-d * 45.0);
  float halo = exp(-d * 10.0) * 0.45;
  vec3 tint = palette(hash21(g) * 0.25 + hue + 0.55 + 0.1 * sin(t * 0.3));
  vec3 col = tint * (line * (0.6 + 2.2 * pulse) + halo * (0.35 + pulse));
  col += vec3(1.0) * line * pulse * 0.6 * (1.0 + react * audioBeat);
  col *= glow;
  col *= smoothstep(1.6, 0.3, length(uv));
  gl_FragColor = vec4(tonemap(col * 1.2), 1.0);
}
`;

    let ghostShader;
    let shaderTime = 0;

    function num(value, fallback) {
      return typeof value === 'number' && isFinite(value) ? value : fallback;
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      ghostShader = createShader(vert, frag);
    }

    function draw() {
      const p = window.shaderParams || {};
      const a = window.ghostAudio || {};
      // Speed scales the clock rather than the shader, so changing it never jumps.
      shaderTime += Math.min(deltaTime, 100) / 1000 * num(p.speed, 1.0);
      shader(ghostShader);
      ghostShader.setUniform('resolution', [width, height]);
      ghostShader.setUniform('time', shaderTime);
      ghostShader.setUniform('scale', num(p.scale, 1.0));
      ghostShader.setUniform('flow', num(p.flow, 1.0));
      ghostShader.setUniform('glow', num(p.glow, 1.0));
      ghostShader.setUniform('hue', num(p.hue, 0.0));
      ghostShader.setUniform('react', num(p.react, 0.6));
      ghostShader.setUniform('audioLevel', num(a.level, 0));
      ghostShader.setUniform('audioBass', num(a.bass, 0));
      ghostShader.setUniform('audioMid', num(a.mid, 0));
      ghostShader.setUniform('audioHigh', num(a.high !== undefined ? a.high : a.treble, 0));
      ghostShader.setUniform('audioBeat', num(a.beat, 0));
      rect(0, 0, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
