<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ink Flow · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Ink Flow: Thousands of ink agents follow a noise field and build calligraphy over time. Each kick throws a burst of ink; every 32 hits the field reseeds and the palette turns.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, and put glow, feedback or colour effects after it.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      agents: 1600.0, // min: 200 max: 4000
      scale: 1.0, // min: 0.2 max: 3
      fade: 0.025, // min: 0 max: 0.3
      weight: 1.6, // min: 0.3 max: 4
      hue: 0.55, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'agents', label: 'Agents', type: 'number', min: 200, max: 4000, default: 1600.0 },
      { name: 'scale', label: 'Field Scale', type: 'number', min: 0.2, max: 3, default: 1.0 },
      { name: 'fade', label: 'Fade', type: 'number', min: 0, max: 0.3, default: 0.025 },
      { name: 'weight', label: 'Stroke Weight', type: 'number', min: 0.3, max: 4, default: 1.6 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.55 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    const BUCKETS = 8;
    let xs, ys, pxs, pys, life, count = 0, seed = 1, hueTurn = 0;

    function respawn(i) {
      xs[i] = pxs[i] = random(width);
      ys[i] = pys[i] = random(height);
      life[i] = random(60, 260);
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight);
      background(0);
      xs = new Float32Array(4000); ys = new Float32Array(4000);
      pxs = new Float32Array(4000); pys = new Float32Array(4000);
      life = new Float32Array(4000);
      for (let i = 0; i < 4000; i++) respawn(i);
      noiseSeed(seed);
    }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const n = Math.floor(constrain(P('agents', 1600), 200, 4000));
      const sc = 0.0022 * P('scale', 1);
      const speed = P('speed', 1);
      const react = P('react', 0.8);
      const z = frameCount * 0.0012 * speed;
      const step = (1.4 + 2.2 * react * (a.level || 0)) * speed * 60 * dt;

      if (ev.hits > 0 && ev.hit && ev.hits % 32 === 0) {
        seed++; noiseSeed(seed); hueTurn += 0.12;
      }
      if (ev.hit) {
        // A burst of ink from a random point, sized by the kick.
        const cx = random(width * 0.15, width * 0.85);
        const cy = random(height * 0.15, height * 0.85);
        const burst = Math.floor(n * (0.04 + 0.08 * react * (a.kick || a.beat || 0.6)));
        const r = Math.min(width, height) * 0.02;
        for (let k = 0; k < burst; k++) {
          const i = Math.floor(random(n));
          const ang = random(TWO_PI);
          xs[i] = pxs[i] = cx + cos(ang) * r;
          ys[i] = pys[i] = cy + sin(ang) * r;
          life[i] = random(80, 200);
        }
      }

      const ctx = drawingContext;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + P('fade', 0.04) + ')';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.lineWidth = P('weight', 1.2);

      const paths = [];
      for (let b = 0; b < BUCKETS; b++) paths.push(new Path2D());
      for (let i = 0; i < n; i++) {
        pxs[i] = xs[i]; pys[i] = ys[i];
        const ang = noise(xs[i] * sc, ys[i] * sc, z) * TWO_PI * 2.2;
        xs[i] += Math.cos(ang) * step;
        ys[i] += Math.sin(ang) * step;
        life[i] -= 60 * dt;
        if (life[i] <= 0 || xs[i] < 0 || xs[i] > width || ys[i] < 0 || ys[i] > height) { respawn(i); continue; }
        const b = Math.floor((ang / (TWO_PI * 2.2)) * BUCKETS) % BUCKETS;
        paths[b].moveTo(pxs[i], pys[i]);
        paths[b].lineTo(xs[i], ys[i]);
      }
      const base = (P('hue', 0.55) + hueTurn) * 360;
      for (let b = 0; b < BUCKETS; b++) {
        const h = (base + b * 14) % 360;
        ctx.strokeStyle = 'hsla(' + h + ',90%,' + (58 + b * 3) + '%,0.6)';
        ctx.stroke(paths[b]);
      }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); background(0); }
  </script>
</body>
</html>
