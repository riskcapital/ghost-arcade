<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aurora Veil · Ghost Arcade p5.js shader</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Aurora Veil: Three curtains of aurora light over a starry night sky, folding and rippling with vertical rays. Bass swells the glow.
    // One fullscreen fragment shader driven by p5.js (WEBGL). Sliders come
    // from window.shaderParams; audio from window.ghostAudio. Ghost Arcade Pro
    // runs the shader natively: its uniforms share the sliders' names, and
    // the audio uniforms use Ghost Arcade's audio names.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      scale: 1.0, // min: 0.3 max: 3
      warp: 1.0, // min: 0 max: 2.5
      glow: 1.0, // min: 0 max: 3
      hue: 0.0, // min: 0 max: 1
      react: 0.6, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'scale', label: 'Scale', type: 'number', min: 0.3, max: 3, default: 1.0 },
      { name: 'warp', label: 'Fold', type: 'number', min: 0, max: 2.5, default: 1.0 },
      { name: 'glow', label: 'Glow', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'hue', label: 'Hue Shift', type: 'number', min: 0, max: 1, default: 0.0 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.6 },
    ];

    const vert = `
attribute vec3 aPosition;
void main() {
  vec4 position = vec4(aPosition, 1.0);
  position.xy = position.xy * 2.0 - 1.0;
  gl_Position = position;
}`;

    const frag = `
precision highp float;
uniform vec2 resolution;
uniform float time;
uniform float scale;
uniform float warp;
uniform float glow;
uniform float hue;
uniform float react;
uniform float audioLevel;
uniform float audioBass;
uniform float audioMid;
uniform float audioHigh;
uniform float audioBeat;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.17));
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}
vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2831853 * (t + vec3(0.0, 0.33, 0.67)));
}
vec3 hueRotate(vec3 c, float h) {
  vec3 k = vec3(0.57735);
  float a = h * 6.2831853;
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}
vec3 tonemap(vec3 c) {
  c = max(c, 0.0);
  return c / (1.0 + c * 0.6);
}

void main() {
  vec2 c = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
  float sky = gl_FragCoord.y / resolution.y;
  float t = time * 0.1;
  vec3 col = mix(vec3(0.0, 0.004, 0.015), vec3(0.008, 0.02, 0.055), sky);
  vec2 sg = gl_FragCoord.xy / 2.5;
  float sid = hash21(floor(sg));
  col += vec3(0.8, 0.85, 1.0) * step(0.9982, sid) * (0.4 + 0.6 * sin(time * 2.0 + sid * 60.0));
  float audio = 1.0 + react * (1.1 * audioBass + 0.5 * audioLevel);
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float x = c.x * scale * 1.3 + fi * 1.7;
    float base = -0.18 + 0.32 * fbm(vec2(x * 0.5 + t * 0.6, fi * 3.1)) - 0.1 * fi + 0.08 * fi * fi;
    float fold = fbm(vec2(x * 1.4 * warp + t * 1.5, fi * 7.0 + t * 0.4));
    float rays = vnoise(vec2((x + fold * 0.9 * warp) * 22.0, t * 3.0 + fi * 5.0));
    rays = rays * rays * rays;
    float h = c.y - base;
    float edge = smoothstep(-0.015, 0.02, h);
    float fade = exp(-max(h, 0.0) * (2.6 + fi * 0.8));
    float intensity = edge * fade * (0.25 + 1.6 * rays) * (1.0 - 0.25 * fi);
    vec3 green = vec3(0.12, 1.0, 0.5);
    vec3 violet = vec3(0.55, 0.2, 1.0);
    vec3 tint = mix(green, violet, clamp(h * 2.4, 0.0, 1.0));
    tint = mix(tint, vec3(1.0, 0.25, 0.45), smoothstep(0.35, 0.7, h) * 0.5);
    col += hueRotate(tint, hue) * intensity * audio;
    col += hueRotate(green, hue) * edge * exp(-max(h, 0.0) * 40.0) * 0.6 * (1.0 - 0.3 * fi);
  }
  col *= glow;
  gl_FragColor = vec4(tonemap(col), 1.0);
}
`;

    let ghostShader;
    let shaderTime = 0;

    function num(value, fallback) {
      return typeof value === 'number' && isFinite(value) ? value : fallback;
    }

    function setup() {
      pixelDensity(1);
      createCanvas(windowWidth, windowHeight, WEBGL);
      noStroke();
      ghostShader = createShader(vert, frag);
    }

    function draw() {
      const p = window.shaderParams || {};
      const a = window.ghostAudio || {};
      // Speed scales the clock rather than the shader, so changing it never jumps.
      shaderTime += Math.min(deltaTime, 100) / 1000 * num(p.speed, 1.0);
      shader(ghostShader);
      ghostShader.setUniform('resolution', [width, height]);
      ghostShader.setUniform('time', shaderTime);
      ghostShader.setUniform('scale', num(p.scale, 1.0));
      ghostShader.setUniform('warp', num(p.warp, 1.0));
      ghostShader.setUniform('glow', num(p.glow, 1.0));
      ghostShader.setUniform('hue', num(p.hue, 0.0));
      ghostShader.setUniform('react', num(p.react, 0.6));
      ghostShader.setUniform('audioLevel', num(a.level, 0));
      ghostShader.setUniform('audioBass', num(a.bass, 0));
      ghostShader.setUniform('audioMid', num(a.mid, 0));
      ghostShader.setUniform('audioHigh', num(a.high !== undefined ? a.high : a.treble, 0));
      ghostShader.setUniform('audioBeat', num(a.beat, 0));
      rect(0, 0, width, height);
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
