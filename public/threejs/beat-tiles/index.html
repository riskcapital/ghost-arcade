<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Beat Tiles · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Beat Tiles: A grid of crisp vector tiles that re-roll on every hit, rotating smoothly into place. Rows light up with the bass, mids and highs. Clean edges for mapping onto architecture.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, and put glow, feedback or colour effects after it.
    window.shaderParams = {
      speed: 1.0, // min: 0 max: 3
      tiles: 16.0, // min: 4 max: 40
      flip: 0.3, // min: 0 max: 1
      weight: 0.12, // min: 0.03 max: 0.35
      hue: 0.5, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'tiles', label: 'Tiles Across', type: 'number', min: 4, max: 40, default: 16.0 },
      { name: 'flip', label: 'Flip Amount', type: 'number', min: 0, max: 1, default: 0.3 },
      { name: 'weight', label: 'Line Weight', type: 'number', min: 0.03, max: 0.35, default: 0.12 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.5 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let cols = 0, rows = 0, rot, target, kind, flash;

    function build() {
      cols = Math.floor(constrain(P('tiles', 16), 4, 40));
      rows = Math.max(1, Math.round(cols * height / width));
      const n = cols * rows;
      rot = new Float32Array(n); target = new Float32Array(n); kind = new Uint8Array(n); flash = new Float32Array(n);
      for (let i = 0; i < n; i++) { const r = Math.floor(random(4)) * HALF_PI; rot[i] = target[i] = r; kind[i] = Math.floor(random(3)); }
    }

    function setup() { pixelDensity(1); createCanvas(windowWidth, windowHeight); build(); }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const react = P('react', 0.8);
      if (Math.floor(constrain(P('tiles', 16), 4, 40)) !== cols) build();
      const n = cols * rows;
      if (ev.hit) {
        const amount = P('flip', 0.3) * (0.6 + react * 0.8 * (a.kick || a.beat || 0.5));
        for (let i = 0; i < n; i++) if (random() < amount) { target[i] += random() < 0.5 ? HALF_PI : -HALF_PI; flash[i] = 1; }
      }
      if (ev.snare) {
        const row = Math.floor(random(rows));
        for (let c = 0; c < cols; c++) { const i = row * cols + c; kind[i] = (kind[i] + 1) % 3; flash[i] = 1; }
      }
      const ease = 1 - Math.pow(0.0005, dt * P('speed', 1));
      const ts = width / cols;
      const bands = [a.bass || 0, a.mid || 0, a.high || a.treble || 0];
      const ctx = drawingContext;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      ctx.lineCap = 'round';
      ctx.lineWidth = ts * P('weight', 0.12);
      const base = P('hue', 0.5) * 360;
      for (let r = 0; r < rows; r++) {
        const band = bands[Math.floor((r / rows) * 3)];
        const lum = 45 + 30 * react * band;
        const paths = [new Path2D(), new Path2D()];
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c;
          rot[i] += (target[i] - rot[i]) * ease;
          flash[i] = Math.max(0, flash[i] - dt * 2.5);
          const cx = (c + 0.5) * ts, cy = (r + 0.5) * ts, h = ts * 0.5;
          const cs = Math.cos(rot[i]), sn = Math.sin(rot[i]);
          const T = (x, y) => [cx + x * cs - y * sn, cy + x * sn + y * cs];
          const p = paths[flash[i] > 0.3 ? 1 : 0];
          if (kind[i] === 0) {
            // Two quarter arcs (Truchet).
            const s = rot[i];
            const c1 = T(-h, -h), c2 = T(h, h);
            p.moveTo(c1[0] + Math.cos(s) * h, c1[1] + Math.sin(s) * h);
            p.arc(c1[0], c1[1], h, s, s + HALF_PI);
            p.moveTo(c2[0] + Math.cos(s + PI) * h, c2[1] + Math.sin(s + PI) * h);
            p.arc(c2[0], c2[1], h, s + PI, s + PI + HALF_PI);
          } else if (kind[i] === 1) {
            // Diagonal with a dot.
            const p1 = T(-h, -h), p2 = T(h, h), d = T(h * 0.5, -h * 0.5);
            p.moveTo(p1[0], p1[1]); p.lineTo(p2[0], p2[1]);
            p.moveTo(d[0] + h * 0.12, d[1]); p.arc(d[0], d[1], h * 0.12, 0, TWO_PI);
          } else {
            // Half circle facing the rotation.
            const s = rot[i];
            p.moveTo(cx + Math.cos(s) * h * 0.7, cy + Math.sin(s) * h * 0.7);
            p.arc(cx, cy, h * 0.7, s, s + PI);
          }
        }
        ctx.strokeStyle = 'hsl(' + ((base + r * 6) % 360) + ',85%,' + lum + '%)';
        ctx.stroke(paths[0]);
        ctx.strokeStyle = 'hsl(' + ((base + 180) % 360) + ',95%,80%)';
        ctx.stroke(paths[1]);
      }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); build(); }
  </script>
</body>
</html>
