<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lets Ghost Arcade keep this page's alpha (see the Transparent switch). -->
  <meta name="ghost-arcade-background" content="transparent">
  <title>Differential Growth · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Differential Growth: A single closed line grows, wrinkles and fills space without crossing itself, like coral or brain folds. Audio energy speeds the growth; when it is full it fades and a new seed grows.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, or turn on Transparent to draw over the layers below. Put
    // glow, feedback or colour effects after it in the layer's chain.
    window.shaderParams = {
      transparent: false,
      speed: 1.0, // min: 0 max: 3
      nodes: 3500.0, // min: 300 max: 8000
      spacing: 9.0, // min: 3 max: 20
      glow: 1.0, // min: 0 max: 3
      hue: 0.45, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'transparent', label: 'Transparent', type: 'boolean', default: false },
      { name: 'speed', label: 'Growth Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'nodes', label: 'Max Nodes', type: 'number', min: 300, max: 8000, default: 3500.0 },
      { name: 'spacing', label: 'Spacing', type: 'number', min: 3, max: 20, default: 9.0 },
      { name: 'glow', label: 'Glow', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.45 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function S(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'string' ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Clear or fade the frame. With the Transparent switch on, the canvas
    // fades to see-through instead of black, so the marks can sit over the
    // layers below (Ghost Arcade keeps the alpha for this page).
    function fadeTo(alpha) {
      const ctx = drawingContext;
      const clear = (window.shaderParams || {}).transparent === true;
      ctx.globalCompositeOperation = clear ? 'destination-out' : 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, alpha)) + ')';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'source-over';
    }

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let nx = [], ny = [], fade = 0, growSeed = 0;

    function reset() {
      nx = []; ny = [];
      const r = Math.min(width, height) * 0.06, cx = width / 2 + random(-width * 0.1, width * 0.1), cy = height / 2 + random(-height * 0.1, height * 0.1);
      for (let i = 0; i < 30; i++) { const a = (i / 30) * TWO_PI; nx.push(cx + Math.cos(a) * r); ny.push(cy + Math.sin(a) * r); }
      growSeed++;
    }

    function setup() { pixelDensity(1); createCanvas(windowWidth, windowHeight); reset(); }

    function stepGrowth(sp, rate) {
      const n = nx.length, R = sp * 1.7, R2 = R * R, rest = sp * 0.75;
      // Flat bucket grid (counting sort): no per-step allocation of cells.
      const gc = Math.ceil(width / R) + 2, gr = Math.ceil(height / R) + 2;
      const cellOf = new Int32Array(n), start = new Int32Array(gc * gr + 1), order = new Int32Array(n);
      for (let i = 0; i < n; i++) { const c = (Math.floor(ny[i] / R) + 1) * gc + Math.floor(nx[i] / R) + 1; cellOf[i] = c; start[c + 1]++; }
      for (let c = 0; c < gc * gr; c++) start[c + 1] += start[c];
      const fillAt = start.slice(0, gc * gr);
      for (let i = 0; i < n; i++) order[fillAt[cellOf[i]]++] = i;
      const fx = new Float32Array(n), fy = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const prev = (i - 1 + n) % n, next = (i + 1) % n;
        // Springs to both neighbours, toward a rest length.
        for (const j of [prev, next]) {
          const dx = nx[j] - nx[i], dy = ny[j] - ny[i], d = Math.sqrt(dx * dx + dy * dy) + 1e-6;
          const f = (d - rest) * 0.18;
          fx[i] += dx / d * f; fy[i] += dy / d * f;
        }
        // Smoothing toward the neighbours' midpoint keeps the line supple.
        fx[i] += ((nx[prev] + nx[next]) * 0.5 - nx[i]) * 0.12;
        fy[i] += ((ny[prev] + ny[next]) * 0.5 - ny[i]) * 0.12;
        // Every other nearby node pushes away: this is what folds the line.
        const home = cellOf[i];
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const c = home + oy * gc + ox;
          for (let q = start[c]; q < start[c + 1]; q++) {
            const j = order[q];
            if (j === i || j === prev || j === next) continue;
            const dx = nx[i] - nx[j], dy = ny[i] - ny[j], d2 = dx * dx + dy * dy;
            if (d2 < R2 && d2 > 1e-6) { const d = Math.sqrt(d2), f = (R - d) / R; fx[i] += dx / d * f * 1.1; fy[i] += dy / d * f * 1.1; }
          }
        }
      }
      const m = 6;
      for (let i = 0; i < n; i++) {
        nx[i] = Math.min(width - m, Math.max(m, nx[i] + Math.max(-2, Math.min(2, fx[i]))));
        ny[i] = Math.min(height - m, Math.max(m, ny[i] + Math.max(-2, Math.min(2, fy[i]))));
      }
      // Grow: split edges that stretched, and seed a few new nodes at random.
      const extra = new Set();
      let inserts = Math.floor(rate * 1.5);
      if (Math.random() < rate * 1.5 - inserts) inserts++;
      for (let k = 0; k < inserts; k++) extra.add(Math.floor(Math.random() * n));
      const outX = [], outY = [];
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        outX.push(nx[i]); outY.push(ny[i]);
        const dx = nx[j] - nx[i], dy = ny[j] - ny[i];
        if (dx * dx + dy * dy > sp * sp || extra.has(i)) {
          outX.push((nx[i] + nx[j]) * 0.5 + (Math.random() - 0.5) * 0.6);
          outY.push((ny[i] + ny[j]) * 0.5 + (Math.random() - 0.5) * 0.6);
        }
      }
      nx = outX; ny = outY;
    }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const react = P('react', 0.8);
      const sp = P('spacing', 7);
      if (fade > 0) {
        fade += dt * 0.6;
        if (fade >= 1) { fade = 0; reset(); }
      } else {
        const rate = (1 + react * 3 * (a.level || 0)) * P('speed', 1);
        for (let s = 0; s < 3; s++) {
          stepGrowth(sp, s === 0 ? rate : 0);
          if (nx.length >= P('nodes', 1400)) { fade = 0.0001; break; }
        }
      }
      const ctx = drawingContext;
      fadeTo(1);
      ctx.globalCompositeOperation = 'lighter';
      const path = new Path2D();
      const n = nx.length;
      path.moveTo((nx[n - 1] + nx[0]) / 2, (ny[n - 1] + ny[0]) / 2);
      for (let i = 0; i < n; i++) { const j = (i + 1) % n; path.quadraticCurveTo(nx[i], ny[i], (nx[i] + nx[j]) / 2, (ny[i] + ny[j]) / 2); }
      path.closePath();
      const alpha = 1 - fade;
      const h = (P('hue', 0.45) * 360 + growSeed * 23) % 360;
      ctx.lineJoin = 'round';
      ctx.fillStyle = 'hsla(' + h + ',70%,25%,' + 0.12 * alpha + ')';
      ctx.fill(path);
      ctx.lineWidth = sp * 0.8 * P('glow', 1);
      ctx.strokeStyle = 'hsla(' + h + ',90%,55%,' + 0.22 * alpha + ')';
      ctx.stroke(path);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'hsla(' + ((h + 20) % 360) + ',95%,' + (72 + 18 * (ev.hit ? 1 : 0)) + '%,' + alpha + ')';
      ctx.stroke(path);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); reset(); }
  </script>
</body>
</html>
