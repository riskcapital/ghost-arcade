<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lets Ghost Arcade keep this page's alpha (see the Transparent switch). -->
  <meta name="ghost-arcade-background" content="transparent">
  <title>Flock · Ghost Arcade p5.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <!-- Ghost Arcade loads its own copy of p5.js; this tag lets the file
       run on its own in any browser too. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
</head>
<body>
  <script>
    // Flock: A murmuration of boids leaving light trails. Bass pulls the flock tighter, highs add jitter, and each kick scatters it from a random point.
    // Drawn on black with glowing strokes: set the layer's blend mode to Add
    // or Screen, or turn on Transparent to draw over the layers below. Put
    // glow, feedback or colour effects after it in the layer's chain.
    window.shaderParams = {
      transparent: false,
      speed: 1.0, // min: 0 max: 3
      boids: 700.0, // min: 50 max: 1500
      cohesion: 1.0, // min: 0 max: 3
      trail: 0.85, // min: 0 max: 0.98
      hue: 0.6, // min: 0 max: 1
      react: 0.8, // min: 0 max: 2
    };

    window.shaderParamDefs = [
      { name: 'transparent', label: 'Transparent', type: 'boolean', default: false },
      { name: 'speed', label: 'Speed', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'boids', label: 'Boids', type: 'number', min: 50, max: 1500, default: 700.0 },
      { name: 'cohesion', label: 'Cohesion', type: 'number', min: 0, max: 3, default: 1.0 },
      { name: 'trail', label: 'Trail Length', type: 'number', min: 0, max: 0.98, default: 0.85 },
      { name: 'hue', label: 'Hue', type: 'number', min: 0, max: 1, default: 0.6 },
      { name: 'react', label: 'Audio Reactivity', type: 'number', min: 0, max: 2, default: 0.8 },
    ];

    // ── Ghost Arcade bridge ─────────────────────────────────────────────
    // Sliders arrive in window.shaderParams, audio in window.ghostAudio
    // (level, bass, mid, treble, high, beat, beatPhase, kick, snare, bpm,
    // all 0..1 except bpm). Read both every frame.
    function P(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'number' && isFinite(v) ? v : fallback;
    }
    function S(name, fallback) {
      const v = (window.shaderParams || {})[name];
      return typeof v === 'string' ? v : fallback;
    }
    function A() { return window.ghostAudio || {}; }

    // Musical events from the audio: a "hit" on each kick or beat, a
    // "snare", and a running count of hits (4 hits = a bar). With no audio
    // playing, a steady 120 BPM pulse keeps the sketch performing.
    const pulse = (() => {
      let lastHit = 0, lastSnare = 0, idle = 0, hits = 0, quiet = 0;
      return function (dt) {
        const a = A();
        const hitLevel = Math.max(a.kick || 0, a.beat || 0);
        const snareLevel = a.snare || 0;
        const ev = { hit: false, snare: false, hits };
        const live = a.active || (a.level || 0) > 0.02;
        quiet = live ? 0 : quiet + dt;
        if (quiet < 2) {
          if (hitLevel > 0.55 && lastHit <= 0.55) ev.hit = true;
          if (snareLevel > 0.55 && lastSnare <= 0.55) ev.snare = true;
        } else {
          idle += dt;
          if (idle >= 0.5) { idle -= 0.5; ev.hit = true; ev.snare = hits % 2 === 1; }
        }
        lastHit = hitLevel; lastSnare = snareLevel;
        if (ev.hit) hits++;
        ev.hits = hits;
        return ev;
      };
    })();

    // Clear or fade the frame. With the Transparent switch on, the canvas
    // fades to see-through instead of black, so the marks can sit over the
    // layers below (Ghost Arcade keeps the alpha for this page).
    function fadeTo(alpha) {
      const ctx = drawingContext;
      const clear = (window.shaderParams || {}).transparent === true;
      ctx.globalCompositeOperation = clear ? 'destination-out' : 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, Math.max(0, alpha)) + ')';
      ctx.fillRect(0, 0, width, height);
      if (!clear) {
        // Keep the frame fully opaque: back anything see-through with black.
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    // Frame time in seconds, capped so a stall never makes things jump.
    function frameSeconds() { return Math.min(deltaTime || 16.7, 100) / 1000; }

    let x, y, vx, vy, n = 0, grid = new Map();
    const R = 40;

    function allocate(count) {
      n = count;
      x = new Float32Array(n); y = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n);
      for (let i = 0; i < n; i++) { x[i] = random(width); y[i] = random(height); const a = random(TWO_PI); vx[i] = Math.cos(a) * 2; vy[i] = Math.sin(a) * 2; }
    }

    function setup() { pixelDensity(1); createCanvas(windowWidth, windowHeight); background(0); allocate(Math.floor(P('boids', 700))); }

    function draw() {
      const dt = frameSeconds();
      const ev = pulse(dt);
      const a = A();
      const react = P('react', 0.8);
      const speed = P('speed', 1);
      const wanted = Math.floor(constrain(P('boids', 700), 50, 1500));
      if (wanted !== n) allocate(wanted);
      grid.clear();
      for (let i = 0; i < n; i++) {
        const key = Math.floor(x[i] / R) + Math.floor(y[i] / R) * 1000;
        let cell = grid.get(key); if (!cell) { cell = []; grid.set(key, cell); } cell.push(i);
      }
      const coh = 0.0012 * P('cohesion', 1) * (1 + 2.5 * react * (a.bass || 0));
      const jitter = 0.4 + 3 * react * (a.high || a.treble || 0);
      const maxV = 3.2 * speed;
      let sx = 0, sy = 0;
      if (ev.hit) { sx = random(width); sy = random(height); }
      for (let i = 0; i < n; i++) {
        const gx = Math.floor(x[i] / R), gy = Math.floor(y[i] / R);
        let cx = 0, cy = 0, ax = 0, ay = 0, px = 0, py = 0, m = 0;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const cell = grid.get(gx + ox + (gy + oy) * 1000); if (!cell) continue;
          for (const j of cell) {
            if (j === i) continue;
            const dx = x[j] - x[i], dy = y[j] - y[i], d2 = dx * dx + dy * dy;
            if (d2 > R * R) continue;
            m++; cx += x[j]; cy += y[j]; ax += vx[j]; ay += vy[j];
            if (d2 < 484) { const f = (484 - d2) / 484; px -= dx * f * 0.02; py -= dy * f * 0.02; }
          }
        }
        if (m > 0) {
          vx[i] += (cx / m - x[i]) * coh + (ax / m - vx[i]) * 0.09 + px;
          vy[i] += (cy / m - y[i]) * coh + (ay / m - vy[i]) * 0.09 + py;
        }
        vx[i] += (noise(x[i] * 0.0015, y[i] * 0.0015, frameCount * 0.004) - 0.5) * 0.35 + (Math.random() - 0.5) * jitter * 0.3;
        vy[i] += (noise(y[i] * 0.0015, x[i] * 0.0015, 7 + frameCount * 0.004) - 0.5) * 0.35 + (Math.random() - 0.5) * jitter * 0.3;
        // Keep a cruising speed so the flock streams instead of stalling.
        const sp0 = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) + 1e-6;
        if (sp0 < 1.4 * speed) { vx[i] *= 1.4 * speed / sp0; vy[i] *= 1.4 * speed / sp0; }
        if (ev.hit) { const dx = x[i] - sx, dy = y[i] - sy, d = Math.sqrt(dx * dx + dy * dy) + 1; if (d < 300) { vx[i] += dx / d * 5 * react; vy[i] += dy / d * 5 * react; } }
        const v = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
        if (v > maxV) { vx[i] *= maxV / v; vy[i] *= maxV / v; }
        x[i] += vx[i] * 60 * dt; y[i] += vy[i] * 60 * dt;
        if (x[i] < 0) x[i] += width; if (x[i] > width) x[i] -= width;
        if (y[i] < 0) y[i] += height; if (y[i] > height) y[i] -= height;
      }
      const ctx = drawingContext;
      fadeTo(1 - P('trail', 0.85));
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      const paths = [new Path2D(), new Path2D(), new Path2D()];
      for (let i = 0; i < n; i++) {
        const v = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]);
        const p = paths[v < 1.6 ? 0 : v < 2.6 ? 1 : 2];
        p.moveTo(x[i] - vx[i] * 5, y[i] - vy[i] * 5);
        p.lineTo(x[i], y[i]);
      }
      const base = P('hue', 0.6) * 360;
      ctx.lineWidth = 2.6;
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = 'hsla(' + ((base + k * 40) % 360) + ',95%,' + (48 + k * 6) + '%,0.55)';
        ctx.stroke(paths[k]);
      }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); background(0); }
  </script>
</body>
</html>
