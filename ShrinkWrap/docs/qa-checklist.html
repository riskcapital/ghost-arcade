<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Arcade - QA Testing Checklist</title>
<style>
  :root {
    --bg-primary: #0a0a0c;
    --bg-secondary: rgba(18, 18, 22, 0.95);
    --bg-tertiary: #141418;
    --bg-overlay: rgba(0, 0, 0, 0.85);
    --accent-primary: #FF6B6B;
    --accent-secondary: #FF8585;
    --accent-hover: #FF5252;
    --text-primary: #e8e8e8;
    --text-secondary: #a0a0a0;
    --text-muted: #666666;
    --border-color: #2a2a32;
    --success: #4ade80;
    --warning: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border-color);
    padding: 12px 24px;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header h1 span { font-weight: 400; -webkit-text-fill-color: var(--text-secondary); }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 200px;
    max-width: 500px;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: var(--bg-primary);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-primary), var(--success));
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 0.85rem;
    color: var(--text-secondary);
    white-space: nowrap;
    min-width: 90px;
    text-align: right;
  }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
  .btn.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
  .btn.danger { border-color: #ef4444; color: #ef4444; }
  .btn.danger:hover { background: #ef4444; color: #fff; }

  .filter-group { display: flex; gap: 4px; }
  .separator { width: 1px; height: 24px; background: var(--border-color); margin: 0 4px; }

  /* MAIN */
  .main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

  /* SECTION */
  .section {
    margin-bottom: 24px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--bg-secondary);
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border-color);
    transition: background 0.15s;
  }
  .section-header:hover { background: #1a1a20; }
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title .arrow {
    display: inline-block;
    transition: transform 0.2s;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .section-title .arrow.collapsed { transform: rotate(-90deg); }
  .section-count {
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 10px;
    background: var(--bg-primary);
    color: var(--text-secondary);
  }
  .section-count.complete { background: rgba(74, 222, 128, 0.15); color: var(--success); }
  .section-body { padding: 8px 0; }
  .section-body.collapsed { display: none; }

  /* ITEM */
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 18px;
    transition: background 0.1s;
  }
  .item:hover { background: rgba(255,255,255,0.02); }
  .item.checked .item-label { color: var(--text-muted); text-decoration: line-through; }
  .item.hidden { display: none; }

  .item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border: 2px solid var(--border-color);
    border-radius: 4px;
    background: var(--bg-primary);
    cursor: pointer;
    position: relative;
    margin-top: 2px;
    transition: all 0.15s;
  }
  .item input[type="checkbox"]:checked {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
  }
  .item input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .item-label { font-size: 0.88rem; color: var(--text-primary); cursor: pointer; flex: 1; }
  .item-time { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; margin-top: 3px; }

  /* NOTES */
  .notes-wrap { padding: 8px 18px 14px; }
  .notes-wrap label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .notes-wrap textarea {
    width: 100%;
    min-height: 56px;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 8px 10px;
    font-size: 0.82rem;
    font-family: inherit;
    resize: vertical;
  }
  .notes-wrap textarea:focus { outline: none; border-color: var(--accent-primary); }

  /* PRINT */
  @media print {
    body { background: #fff; color: #000; }
    .header { position: static; background: #fff; border-bottom: 2px solid #000; }
    .header h1 { background: none; -webkit-text-fill-color: #000; }
    .header h1 span { -webkit-text-fill-color: #555; }
    .toolbar, .btn { display: none !important; }
    .progress-fill { background: #333 !important; }
    .progress-bar { background: #ddd; }
    .progress-text { color: #333; }
    .section { border-color: #ccc; background: #fff; break-inside: avoid; }
    .section-header { background: #f5f5f5; border-bottom-color: #ccc; }
    .section-title { color: #000; }
    .section-title .arrow { display: none; }
    .section-body { display: block !important; }
    .item { page-break-inside: avoid; }
    .item-label { color: #000 !important; }
    .item.checked .item-label { color: #888 !important; }
    .item input[type="checkbox"] { border-color: #999; background: #fff; }
    .item input[type="checkbox"]:checked { background: #333; border-color: #333; }
    .notes-wrap textarea { border-color: #ccc; background: #fafafa; color: #000; }
    .item-time { color: #888; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Ghost Arcade <span>QA Checklist</span></h1>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0 (0%)</div>
    </div>
  </div>
  <div class="toolbar">
    <div class="filter-group">
      <button class="btn active" data-filter="all">All</button>
      <button class="btn" data-filter="unchecked">Unchecked</button>
      <button class="btn" data-filter="checked">Checked</button>
    </div>
    <div class="separator"></div>
    <button class="btn" id="btnExpandAll">Expand All</button>
    <button class="btn" id="btnCollapseAll">Collapse All</button>
    <div class="separator"></div>
    <button class="btn" id="btnExport">Export JSON</button>

    <div class="separator"></div>
    <button class="btn" id="btnPrint">Print</button>
    <button class="btn danger" id="btnReset">Reset All</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
</div>

<div class="main" id="main"></div>

// --- STATE ---
let state = loadState();
let currentFilter = 'all';

function defaultState() {
  const s = { checked: {}, timestamps: {}, notes: {}, collapsed: {} };
  SECTIONS.forEach(sec => {
    sec.items.forEach((_, i) => { s.checked[sec.id + ':' + i] = false; });
    s.notes[sec.id] = '';
    s.collapsed[sec.id] = false;
  });
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // Merge with defaults so new items are included
    const def = defaultState();
    return {
      checked: { ...def.checked, ...parsed.checked },
      timestamps: { ...parsed.timestamps },
      notes: { ...def.notes, ...parsed.notes },
      collapsed: { ...def.collapsed, ...parsed.collapsed },
    };
  } catch { return defaultState(); }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// --- RENDER ---
function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  SECTIONS.forEach(sec => {
    const el = document.createElement('div');
    el.className = 'section';
    el.dataset.section = sec.id;

    const checkedCount = sec.items.filter((_, i) => state.checked[sec.id + ':' + i]).length;
    const total = sec.items.length;
    const allDone = checkedCount === total;
    const isCollapsed = state.collapsed[sec.id];

    el.innerHTML = `
      <div class="section-header" data-toggle="${sec.id}">
        <div class="section-title">
          <span class="arrow ${isCollapsed ? 'collapsed' : ''}">&#9660;</span>
          ${sec.title}
        </div>
        <span class="section-count ${allDone ? 'complete' : ''}">${checkedCount} / ${total}</span>
      </div>
      <div class="section-body ${isCollapsed ? 'collapsed' : ''}">
        ${sec.items.map((item, i) => {
          const key = sec.id + ':' + i;
          const checked = state.checked[key];
          const ts = state.timestamps[key] || '';
          const hidden = (currentFilter === 'unchecked' && checked) || (currentFilter === 'checked' && !checked);
          return `<div class="item ${checked ? 'checked' : ''} ${hidden ? 'hidden' : ''}">
            <input type="checkbox" ${checked ? 'checked' : ''} data-key="${key}">
            <label class="item-label" data-key="${key}">${item}</label>
            ${ts ? `<span class="item-time">${ts}</span>` : ''}
          </div>`;
        }).join('')}
        <div class="notes-wrap">
          <label>Notes</label>
          <textarea data-notes="${sec.id}" placeholder="Testing notes for ${sec.title}...">${state.notes[sec.id] || ''}</textarea>
        </div>
      </div>
    `;
    main.appendChild(el);
  });

  updateProgress();
}

function updateProgress() {
  let total = 0, checked = 0;
  SECTIONS.forEach(sec => {
    sec.items.forEach((_, i) => {
      total++;
      if (state.checked[sec.id + ':' + i]) checked++;
    });
  });
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${checked} / ${total} (${pct}%)`;
}

// --- EVENTS ---
document.getElementById('main').addEventListener('change', e => {
  if (e.target.type === 'checkbox') {
    const key = e.target.dataset.key;
    state.checked[key] = e.target.checked;
    if (e.target.checked) {
      const now = new Date();
      state.timestamps[key] = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } else {
      delete state.timestamps[key];
    }
    saveState();
    render();
  }
});

document.getElementById('main').addEventListener('click', e => {
  // Label click toggles checkbox
  if (e.target.classList.contains('item-label')) {
    const key = e.target.dataset.key;
    const cb = document.querySelector(`input[data-key="${key}"]`);
    if (cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); }
    return;
  }
  // Section toggle
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const id = toggle.dataset.toggle;
    state.collapsed[id] = !state.collapsed[id];
    saveState();
    render();
  }
});

document.getElementById('main').addEventListener('input', e => {
  if (e.target.tagName === 'TEXTAREA' && e.target.dataset.notes) {
    state.notes[e.target.dataset.notes] = e.target.value;
    saveState();
  }
});

// Filter buttons
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Expand / Collapse
document.getElementById('btnExpandAll').addEventListener('click', () => {
  SECTIONS.forEach(s => state.collapsed[s.id] = false);
  saveState();
  render();
});
document.getElementById('btnCollapseAll').addEventListener('click', () => {
  SECTIONS.forEach(s => state.collapsed[s.id] = true);
  saveState();
  render();
});

// Export
document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ghost-arcade-qa-state-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

// Import
document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (imported.checked) {
        state = { ...defaultState(), ...imported, checked: { ...defaultState().checked, ...imported.checked } };
        saveState();
        render();
      }
    } catch { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Print
document.getElementById('btnPrint').addEventListener('click', () => window.print());

// Reset
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Reset ALL checkboxes, timestamps, and notes? This cannot be undone.')) {
    state = defaultState();
    saveState();
    render();
  }
});

// Init
render();
</script>
</body>
</html>
