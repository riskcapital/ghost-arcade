appId: live.ghostarcade.app
productName: "Ghost Arcade"          # user-facing display name (start menu, window title)
executableName: "Ghost-Arcade"       # actual .exe filename — no spaces so signtool can quote-free
copyright: "Copyright (c) 2024-2026 Risk Capital Media LLC"
artifactName: "Ghost-Arcade-${version}-${arch}.${ext}"

directories:
  output: dist-electron
  buildResources: build-resources

beforePack: build-resources/beforePack.cjs
afterPack: build-resources/afterPack.cjs

files:
  - dist/**/*
  - electron/**/*
  - server/**/*
  - package.json
  - "!electron/native/node_modules/**/*"
  - "!electron/native/build/**/*.obj"
  - "!electron/native/build/**/*.pdb"
  - "!electron/native/build/Release/Syphon.framework/**/*"
  - "!electron/native/build/Release/Processing.NDI.Lib*.dll"
  - "!electron/native/build/Release/libndi.*"
  - "!electron/native/vendor/Syphon.framework/**/*"

# Platform-specific extra resources
extraResources:
  # The native render core. 2.0 is native-only (NATIVE_ENGINE_ONLY): if this
  # binary is not inside the package the broker's findExecutable() returns
  # null and the app opens straight into NATIVE OFFLINE with no renderer to
  # fall back to. It resolves from
  # `{resourcesPath}/native-renderer/ghost-render-core` — see
  # electron/native-renderer-broker.js.
  #
  # One entry covers every platform on purpose. The `from` directory is the
  # same everywhere, and the filter picks whichever artefacts that platform
  # actually produced: the bare binary on macOS/Linux, the .exe plus the DXC
  # DLLs on Windows (scripts/ensure-dxc.mjs drops those beside the binary,
  # because Windows resolves them relative to the launched executable rather
  # than the app root). Naming the files per platform instead would mean
  # three near-identical blocks that can drift apart.
  - from: native-renderer/target/release/
    to: native-renderer/
    filter:
      - ghost-render-core
      - ghost-render-core.exe
      - dxcompiler.dll
      - dxil.dll

  # Shaders (all platforms)
  - from: ISF/
    to: ISF/
    filter:
      - "**/*"
  - from: CuratedISF/
    to: CuratedISF/
    filter:
      - "**/*"
  - from: user-shaders/
    to: user-shaders/
    filter:
      - "**/*"

asarUnpack:
  - "electron/native/**/*.node"
  - "node_modules/ffmpeg-static/**/*"

# ─── File Associations ─────────────────────────────────────────────────────
fileAssociations:
  - ext: gha
    name: "Ghost Arcade Project"
    description: "Ghost Arcade Project File"
    role: Editor

# ─── Windows ───────────────────────────────────────────────────────────────
win:
  extraResources:
    - from: build-resources/ffmpeg/win32-x64/
      to: ffmpeg/
      filter:
        - ffmpeg.exe
        - LICENSE
        - README.txt
        - provenance.json
  target: nsis
  icon: build-resources/icons/icon.ico
  # Azure Trusted Signing — short-lived certs issued per-build, RFC 3161
  # timestamp ensures signed binaries stay valid past cert expiry.
  # Auth: env vars AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
  # (Service Principal in CI; interactive `az login` for local builds).
  #
  # Schema notes (electron-builder 26):
  #   - `publisherName` is REQUIRED inside azureSignOptions (it was a
  #     root-level win.* property in electron-builder 25; both my v25→26
  #     migration attempts overshot — the first kept it at root and got
  #     "unknown property", the second removed it and got "misses
  #     property". Correct landing: inside azureSignOptions, exactly as
  #     it appears on the signing cert's CN). Several names allowed.
  #   - The original "Invoke-TrustedSigning rejects it" comment referred
  #     to a different `publisher` field in the upstream PowerShell
  #     module's params, NOT this electron-builder schema field.
  azureSignOptions:
    publisherName: "Justin Wood"
    endpoint: "https://eus.codesigning.azure.net/"
    codeSigningAccountName: "JustinWood"
    certificateProfileName: "ill-visuals-prod"
    timestampRfc3161: "http://timestamp.acs.microsoft.com"
    timestampDigest: "SHA256"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icons/icon.ico
  uninstallerIcon: build-resources/icons/icon.ico
  installerSidebar: brand-assets/installer-splash.bmp
  uninstallerSidebar: brand-assets/installer-splash.bmp
  shortcutName: "Ghost Arcade"
  artifactName: "Ghost-Arcade-Setup-${version}.${ext}"

# ─── macOS ─────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build-resources/icons/icon.icns
  category: public.app-category.video
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: true
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: "Ghost Arcade uses the selected camera as a live visual source."
  signIgnore:
    - '/Syphon\.framework/Syphon$'
    - '/Syphon\.framework/Versions/Current/Syphon$'
  # Ship native runtime frameworks inside the .app's Contents/Frameworks/.
  # Syphon.framework is REQUIRED for macOS texture-share support; the
  # native build stages it into electron/native/build/Release from either
  # electron/native/vendor/Syphon.framework (release/CI preferred) or
  # a local Frameworks install.
  extraFiles:
    - from: electron/native/build/Release/Syphon.framework
      to: Frameworks/Syphon.framework
      filter:
        - "**/*"

dmg:
  iconSize: 128
  contents:
    - x: 380
      y: 170
      type: link
      path: /Applications
    - x: 130
      y: 170
      type: file

# ─── Linux ─────────────────────────────────────────────────────────────────
# AppImage is the single-file portable target — works on most distros without
# admin install. .deb is the Ubuntu/Debian native package. Most VJ users on
# Linux are on Ubuntu, so shipping both gives them a choice. No signing on
# Linux (no equivalent to Authenticode / notarization in mainstream distros).
# electron-builder's own deb defaults (app-builder-lib FpmTarget
# getDefaultDepends), restated because setting `depends` replaces them, plus
# what the native render core needs at runtime on Linux:
#   - libasound2: clip audio plays through cpal's ALSA backend.
#   - libxkbcommon-x11-0: winit's X11 backend loads it, and native Screens are
#     presented as X11 children of their Electron windows. Without it the core
#     falls back to Wayland and Screens are unavailable (it no longer crashes).
#   - libvulkan1: the Vulkan loader. wgpu opens it at runtime (nothing links
#     it, so no tool flags it missing), and without it the core finds no
#     adapter and the app opens into NATIVE OFFLINE. The GPU driver's Vulkan
#     ICD comes from the driver itself (Mesa or the vendor's package).
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libxkbcommon-x11-0
    - libx11-xcb1
    - libxcursor1
    - libxrandr2
    - libxi6
    - libvulkan1

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build-resources/icons
  category: AudioVideo
  synopsis: "Open-source projection mapping + VJ software"
  description: "Ghost Arcade — live performance visuals with projection mapping, shader effects, MediaPipe gesture input, and audio reactivity. AGPL-3.0."
  desktop:
    entry:
      Name: "Ghost Arcade"
      Comment: "Projection mapping and VJ software"
      Categories: "AudioVideo;Graphics;"
  # Same filename pattern as Windows/Mac so the website's URL templating
  # in src/lib/release.ts stays predictable.
  artifactName: "Ghost-Arcade-${version}-${arch}.${ext}"

# ─── Publish ────────────────────────────────────────────────────────────────
# Intentionally NO `publish:` block here. CI (.github/workflows/build.yml)
# runs `electron-builder --publish never` and then uses
# `softprops/action-gh-release` to upload the signed artifacts to the
# CROSS-REPO release target `riskcapital/ghost-arcade-releases`. Adding a
# `publish:` block here would either be ignored (because of --publish never)
# or, if someone ran a local `--publish always`, push to the wrong repo.
# The release flow is: push a `v*` git tag → CI builds + signs + uploads.
